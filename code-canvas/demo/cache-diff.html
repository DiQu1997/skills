<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Canvas</title>
<style>
  /* ============ design tokens: light is the default theme ============ */
  :root {
    --bg: #f6f7f9; --bg-dot: #e2e6ec;
    --text: #24292f; --text-dim: #57606a; --text-faint: #8b949e;
    --card-bg: #ffffff; --card-hdr: #f1f4f8; --card-bd: #d5dbe3; --card-hdr-bd: #e4e9ef;
    --card-shadow: 0 6px 18px rgba(20, 30, 46, .08);
    --fname: #1f2328; --file: #7d8794; --ln-no: #a6afb9;
    --hot-bg: rgba(9,105,218,.08); --hot-bar: #0969da;
    --add-bg: rgba(26,127,55,.09); --add-bar: #1a7f37;
    --del-bg: rgba(207,34,46,.05); --del-text: #9a6068; --del-no: #c0424d;
    --kw: #cf222e; --fn: #8250df; --str: #0a3069; --num: #0550ae; --cmt: #6e7781;
    --wire-call: #64788f; --wire-call-on: #2d4a6d;
    --wire-data: #b07d17; --wire-data-on: #8a5f00;
    --leader: #a08a55;
    --note-bg: #fdf7e6; --note-bd: #e3d4a9; --note-left: #c9a227; --note-text: #6b5a23;
    --note-tag: #a08a55; --note-hot-bd: #b8912a; --note-hot-text: #55471a;
    --note-hot-ring: 0 0 0 1px rgba(184,145,42,.35), 0 8px 20px rgba(20,30,46,.12);
    --bgnote-bg: #edf4fb; --bgnote-bd: #c3d8eb; --bgnote-left: #4c8dc9; --bgnote-text: #38536d;
    --bgnote-tag: #6d90ad; --bgnote-hot-bd: #3f7fb9; --bgnote-hot-text: #2b4257;
    --bgnote-hot-ring: 0 0 0 1px rgba(76,141,201,.35), 0 8px 20px rgba(20,30,46,.12);
    --chrome-bg: rgba(255,255,255,.93); --chrome-bd: #d5dbe3;
    --btn-bg: #f1f4f8; --btn-bd: #cdd5de; --btn-text: #444d56;
    --input-bg: #ffffff; --input-bd: #cdd5de;
    --accent: #0969da; --dot: #c6cfd9;
    --sev-blocker: #cf222e; --sev-concern: #9a6700; --sev-nit: #57606a;
    --rg-blue-bg: rgba(9,105,218,.05);   --rg-blue-bd: rgba(9,105,218,.32);   --rg-blue-lb: #0969da;
    --rg-green-bg: rgba(26,127,55,.05);  --rg-green-bd: rgba(26,127,55,.32);  --rg-green-lb: #1a7f37;
    --rg-violet-bg: rgba(130,80,223,.05);--rg-violet-bd: rgba(130,80,223,.32);--rg-violet-lb: #8250df;
    --rg-amber-bg: rgba(154,103,0,.05);  --rg-amber-bd: rgba(154,103,0,.35);  --rg-amber-lb: #9a6700;
  }
  html[data-theme="dark"] {
    --bg: #111418; --bg-dot: #1c212a;
    --text: #c9d1d9; --text-dim: #98a2b0; --text-faint: #6b7684;
    --card-bg: #1b2027; --card-hdr: #232a33; --card-bd: #39414d; --card-hdr-bd: #333b47;
    --card-shadow: 0 8px 22px rgba(0,0,0,.38);
    --fname: #e3e9f2; --file: #5d6875; --ln-no: #4d5663;
    --hot-bg: rgba(88,166,255,.10); --hot-bar: #58a6ff;
    --add-bg: rgba(63,185,120,.09); --add-bar: #3fb978;
    --del-bg: rgba(214,90,90,.06); --del-text: #8f6f74; --del-no: #a05a5a;
    --kw: #ff7b72; --fn: #d2a8ff; --str: #a5d6ff; --num: #79c0ff; --cmt: #7d8590;
    --wire-call: #8fa0b5; --wire-call-on: #dbe6f4;
    --wire-data: #dfa23e; --wire-data-on: #ffc46b;
    --leader: #8f7d52;
    --note-bg: #26221a; --note-bd: #55492f; --note-left: #b08d3f; --note-text: #d0c3a2;
    --note-tag: #8f7d52; --note-hot-bd: #c8a45a; --note-hot-text: #ecdfbc;
    --note-hot-ring: 0 0 0 1px rgba(200,164,90,.35), 0 8px 20px rgba(0,0,0,.45);
    --bgnote-bg: #1b2330; --bgnote-bd: #324459; --bgnote-left: #57a6c8; --bgnote-text: #a4bfd2;
    --bgnote-tag: #5c86a0; --bgnote-hot-bd: #57a6c8; --bgnote-hot-text: #cfe4f2;
    --bgnote-hot-ring: 0 0 0 1px rgba(87,166,200,.32), 0 8px 20px rgba(0,0,0,.45);
    --chrome-bg: rgba(18,22,28,.93); --chrome-bd: #313945;
    --btn-bg: #2a323d; --btn-bd: #3c4653; --btn-text: #c9d1d9;
    --input-bg: #10141a; --input-bd: #313945;
    --accent: #79a8ff; --dot: #3c4653;
    --sev-blocker: #e08b8b; --sev-concern: #e0b45c; --sev-nit: #9aa4b2;
    --rg-blue-bg: rgba(76,141,255,.05);  --rg-blue-bd: rgba(76,141,255,.32);  --rg-blue-lb: #79a8ff;
    --rg-green-bg: rgba(63,185,120,.05); --rg-green-bd: rgba(63,185,120,.32); --rg-green-lb: #56c98a;
    --rg-violet-bg: rgba(167,139,250,.05);--rg-violet-bd: rgba(167,139,250,.32);--rg-violet-lb: #b39dfc;
    --rg-amber-bg: rgba(224,162,62,.05); --rg-amber-bd: rgba(224,162,62,.32); --rg-amber-lb: #e0b45c;
  }
  /* block palettes per theme (stripe color --bc, tint --bt) */
  .bp0-0 { --bc: #2f6fd0; } .bp0-1 { --bc: #7a52d6; } .bp0-2 { --bc: #1a8a52; }
  .bp0-3 { --bc: #c25e1f; } .bp0-4 { --bc: #a8871a; }
  .bp1-0 { --bc: #c23d7d; } .bp1-1 { --bc: #0f8b93; } .bp1-2 { --bc: #b07817; } .bp1-3 { --bc: #3b64d4; }
  .blk { --bt: color-mix(in srgb, var(--bc) 6%, transparent); }
  html[data-theme="dark"] .bp0-0 { --bc: #5a9cf8; } html[data-theme="dark"] .bp0-1 { --bc: #a78bfa; }
  html[data-theme="dark"] .bp0-2 { --bc: #4cc38a; } html[data-theme="dark"] .bp0-3 { --bc: #f0864c; }
  html[data-theme="dark"] .bp0-4 { --bc: #e5c453; }
  html[data-theme="dark"] .bp1-0 { --bc: #f472b6; } html[data-theme="dark"] .bp1-1 { --bc: #5eead4; }
  html[data-theme="dark"] .bp1-2 { --bc: #facc15; } html[data-theme="dark"] .bp1-3 { --bc: #93c5fd; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }

  #vp { position: fixed; inset: 0; overflow: hidden; cursor: grab; touch-action: none; }
  #vp.dragging { cursor: grabbing; }
  #world { position: absolute; transform-origin: 0 0;
    transition: transform .55s cubic-bezier(.22,.9,.26,1);
    background-image: radial-gradient(circle, var(--bg-dot) 1px, transparent 1px);
    background-size: 28px 28px; }
  #world.notrans { transition: none; }

  /* ---- storyline regions ---- */
  .region { position: absolute; border-radius: 18px; border: 1.5px dashed; z-index: 0; }
  .rlabel { position: absolute; top: -12px; left: 20px; padding: 2px 12px; font-size: 11px;
    border-radius: 99px; background: var(--bg); letter-spacing: .5px; border: 1px solid; }
  .rblurb { position: absolute; top: 12px; left: 22px; font-size: 11px; opacity: .78;
    letter-spacing: .3px; }
  .region.hue-blue   { background: var(--rg-blue-bg);   border-color: var(--rg-blue-bd); }
  .region.hue-green  { background: var(--rg-green-bg);  border-color: var(--rg-green-bd); }
  .region.hue-violet { background: var(--rg-violet-bg); border-color: var(--rg-violet-bd); }
  .region.hue-amber  { background: var(--rg-amber-bg);  border-color: var(--rg-amber-bd); }
  .hue-blue > .rlabel   { color: var(--rg-blue-lb);   border-color: var(--rg-blue-bd); }
  .hue-green > .rlabel  { color: var(--rg-green-lb);  border-color: var(--rg-green-bd); }
  .hue-violet > .rlabel { color: var(--rg-violet-lb); border-color: var(--rg-violet-bd); }
  .hue-amber > .rlabel  { color: var(--rg-amber-lb);  border-color: var(--rg-amber-bd); }
  .hue-blue > .rblurb   { color: var(--rg-blue-lb); }
  .hue-green > .rblurb  { color: var(--rg-green-lb); }
  .hue-violet > .rblurb { color: var(--rg-violet-lb); }
  .hue-amber > .rblurb  { color: var(--rg-amber-lb); }

  /* ---- code cards ---- */
  .card { position: absolute; background: var(--card-bg); border: 1px solid var(--card-bd);
    border-radius: 10px; box-shadow: var(--card-shadow); z-index: 2; transition: opacity .35s;
    overflow: hidden; }
  .card .hdr { display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    background: var(--card-hdr); border-bottom: 1px solid var(--card-hdr-bd);
    border-radius: 10px 10px 0 0; cursor: pointer; white-space: nowrap; }
  .card.collapsed .hdr { border-bottom: none; border-radius: 10px; }
  .card.collapsed .body { display: none; }
  .chev { color: var(--text-faint); font-size: 9px; width: 10px; flex: none; }
  .fname { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px;
    color: var(--fname); font-weight: 600; }
  .file { margin-left: auto; color: var(--file); font-size: 10px; padding-left: 14px; }
  .body { padding: 8px 0; }
  .ln { white-space: pre; font: 12px/1.75 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    padding: 0 14px 0 10px; }
  .ln .no { display: inline-block; width: 20px; text-align: right; margin-right: 12px;
    color: var(--ln-no); user-select: none; }
  .ln.hot { background: var(--hot-bg); box-shadow: inset 2px 0 0 var(--hot-bar); }
  .ln.add { background: var(--add-bg); box-shadow: inset 2px 0 0 var(--add-bar); }
  .ln.add.hot { box-shadow: inset 2px 0 0 var(--hot-bar); }
  .ln.del { background: var(--del-bg); color: var(--del-text); text-decoration: line-through; }
  .ln.del .no { color: var(--del-no); text-decoration: none; }
  .dbadge { font: 10px ui-monospace, Menlo, Consolas, monospace; padding: 0 7px;
    border-radius: 99px; background: var(--btn-bg); border: 1px solid var(--card-bd); flex: none; }
  .dbadge b { color: var(--add-bar); font-weight: 600; }
  .dbadge i { color: var(--sev-blocker); font-style: normal; }
  .kw { color: var(--kw); } .fn { color: var(--fn); } .str { color: var(--str); }
  .num { color: var(--num); } .cmt { color: var(--cmt); }
  .card.dim { opacity: .32; }

  /* ---- intra-function logical blocks ---- */
  .blk { border-left: 3px solid var(--bc); background: var(--bt); margin: 3px 0 3px 8px;
    border-radius: 0 6px 6px 0; }
  .blk .ln { padding-left: 6px; }
  .bbar { display: flex; align-items: baseline; gap: 7px; padding: 3px 10px 3px 7px;
    cursor: pointer; font-size: 10.5px; line-height: 1.7; white-space: nowrap; }
  .bbar:hover { background: color-mix(in srgb, var(--text) 4%, transparent); }
  .bchev { color: var(--bc); font-size: 8px; }
  .bname { color: var(--bc); font-weight: 600; }
  .bsum { color: var(--text-dim); }
  .brange { margin-left: 10px; color: var(--text-faint); font-size: 9.5px; padding-left: 4px;
    font-family: ui-monospace, Menlo, Consolas, monospace; }
  .blk.folded > .bcode { display: none; }
  .bbtn { font-size: 9px; padding: 0 7px; border-radius: 99px; border: 1px solid var(--btn-bd);
    color: var(--text-dim); cursor: pointer; line-height: 1.6; flex: none; align-self: center;
    background: var(--card-bg); }
  .bbtn:hover { color: var(--text); border-color: var(--text-faint); }
  .bxplain { display: none; padding: 7px 14px 8px 10px; font-size: 11.5px; line-height: 1.7;
    color: var(--text-dim); border-top: 1px dashed color-mix(in srgb, var(--text) 12%, transparent);
    white-space: normal; max-width: 560px; }
  .blk.explained > .bxplain { display: block; }
  .blk.qa-target { box-shadow: 0 0 0 1.5px var(--bc); }

  /* ---- term annotations ---- */
  .term { border-bottom: 1px dotted var(--text-faint); cursor: pointer; }
  .term:hover { border-bottom-color: var(--text); color: var(--text); }
  .term.on { background: color-mix(in srgb, var(--note-left) 18%, transparent);
    border-bottom-color: var(--note-left); }
  .tnote { display: none; margin: 1px 14px 4px 48px; padding: 5px 10px; font-size: 11px;
    line-height: 1.65; color: var(--note-text);
    background: color-mix(in srgb, var(--note-left) 8%, transparent);
    border-left: 2px solid var(--note-tag); border-radius: 0 6px 6px 0; white-space: normal;
    max-width: 480px; }
  .tnote.open { display: block; }

  /* ---- per-block Q&A drawer ---- */
  #qa { position: fixed; top: 0; right: -420px; width: 390px; height: 100%; z-index: 20;
    background: var(--card-bg); border-left: 1px solid var(--chrome-bd); display: flex;
    flex-direction: column; transition: right .3s ease; box-shadow: -12px 0 30px rgba(20,30,46,.12); }
  #qa.open { right: 0; }
  #qa header { padding: 14px 44px 10px 16px; border-bottom: 1px solid var(--card-hdr-bd); position: relative; }
  #qa-path { font-size: 10.5px; color: var(--text-faint); margin-bottom: 3px; }
  #qa-name { font: 600 13px ui-monospace, Menlo, Consolas, monospace; color: var(--fname); }
  #qa-close { position: absolute; top: 10px; right: 10px; width: 26px; height: 26px;
    background: none; border: 1px solid var(--btn-bd); border-radius: 7px; color: var(--text-dim);
    cursor: pointer; font-size: 12px; }
  #qa-close:hover { color: var(--text); }
  #qa-log { flex: 1; overflow-y: auto; padding: 12px 16px; }
  .qa-q { background: var(--btn-bg); border-radius: 10px 10px 3px 10px; padding: 8px 11px;
    margin: 10px 0 6px auto; max-width: 88%; width: fit-content; font-size: 12px; color: var(--text); }
  .qa-a { font-size: 12px; line-height: 1.7; color: var(--text-dim); margin: 0 0 10px;
    padding: 8px 11px; background: var(--card-hdr); border-radius: 10px 10px 10px 3px;
    border-left: 2px solid var(--accent); white-space: pre-wrap; }
  .qa-a.err { border-left-color: var(--sev-blocker); color: var(--sev-blocker); }
  .qa-a.busy { border-left-color: var(--text-faint); color: var(--text-faint); font-style: italic; }
  .qa-hint { font-size: 11px; color: var(--text-faint); line-height: 1.7; padding: 6px 0; }
  #qa-form { padding: 12px 16px 16px; border-top: 1px solid var(--card-hdr-bd); display: flex; gap: 8px; }
  #qa-input { flex: 1; background: var(--input-bg); border: 1px solid var(--input-bd);
    color: var(--text); border-radius: 8px; padding: 8px 10px; font-size: 12px; resize: none;
    height: 62px; font-family: inherit; }
  #qa-send { align-self: flex-end; background: var(--accent); border: none; color: #fff;
    border-radius: 8px; padding: 8px 16px; cursor: pointer; font-size: 12px; }
  html[data-theme="dark"] #qa-send { background: #2a5a9c; color: #e8eef6; }
  #qa-send:disabled { opacity: .45; cursor: default; }

  /* ---- notes ---- */
  .note { position: absolute; width: 250px; background: var(--note-bg); border: 1px solid var(--note-bd);
    border-left: 3px solid var(--note-left); border-radius: 8px; padding: 9px 12px; font-size: 11.5px;
    line-height: 1.65; color: var(--note-text); z-index: 4; transition: opacity .35s; }
  .note .tag { font-size: 9.5px; color: var(--note-tag); margin-bottom: 3px; letter-spacing: 1px; }
  .sev { display: inline-block; font-size: 9px; padding: 0 7px; border-radius: 99px;
    margin-left: 7px; letter-spacing: .5px; vertical-align: 1px; border: 1px solid; }
  .sev.blocker { color: var(--sev-blocker); border-color: var(--sev-blocker);
    background: color-mix(in srgb, var(--sev-blocker) 12%, transparent); }
  .sev.concern { color: var(--sev-concern); border-color: var(--sev-concern);
    background: color-mix(in srgb, var(--sev-concern) 12%, transparent); }
  .sev.nit { color: var(--sev-nit); border-color: var(--sev-nit);
    background: color-mix(in srgb, var(--sev-nit) 10%, transparent); }
  #findings { position: fixed; top: 60px; left: 18px; z-index: 10; display: flex; gap: 8px;
    align-items: center; font-size: 11px; color: var(--text-dim); background: var(--chrome-bg);
    border: 1px solid var(--chrome-bd); border-radius: 99px; padding: 4px 14px; cursor: pointer; }
  #findings:hover { border-color: var(--text-faint); color: var(--text); }
  #findings b.blocker { color: var(--sev-blocker); } #findings b.concern { color: var(--sev-concern); }
  #findings b.nit { color: var(--sev-nit); }
  .note.hot { border-color: var(--note-hot-bd); border-left-color: var(--note-hot-bd);
    color: var(--note-hot-text); box-shadow: var(--note-hot-ring); }
  .note.dim { opacity: .32; }
  .note.bg { background: var(--bgnote-bg); border-color: var(--bgnote-bd);
    border-left-color: var(--bgnote-left); color: var(--bgnote-text); }
  .note.bg .tag { color: var(--bgnote-tag); }
  .note.bg.hot { border-color: var(--bgnote-hot-bd); border-left-color: var(--bgnote-hot-bd);
    color: var(--bgnote-hot-text); box-shadow: var(--bgnote-hot-ring); }

  /* ---- reader profile + theme ---- */
  #profile-btn, #theme-btn { position: fixed; top: 86px; z-index: 15; font-size: 11px;
    padding: 4px 12px; border-radius: 99px; border: 1px solid var(--btn-bd);
    background: var(--chrome-bg); color: var(--text-dim); cursor: pointer; }
  #profile-btn { right: 18px; }
  #theme-btn { right: 108px; }
  #profile-btn:hover, #theme-btn:hover { color: var(--text); border-color: var(--text-faint); }
  body.has-profile #profile-btn { color: var(--accent); border-color: var(--accent); }
  #pp { position: fixed; top: 120px; right: 18px; z-index: 15; width: 320px;
    background: var(--card-bg); border: 1px solid var(--chrome-bd); border-radius: 12px;
    padding: 14px; box-shadow: 0 14px 34px rgba(20,30,46,.18); }
  #pp[hidden] { display: none; }
  .pp-t { font-size: 12px; font-weight: 600; color: var(--fname); margin-bottom: 8px; }
  #pp-input { width: 100%; height: 92px; background: var(--input-bg); border: 1px solid var(--input-bd);
    color: var(--text); border-radius: 8px; padding: 8px 10px; font-size: 11.5px; resize: none;
    font-family: inherit; line-height: 1.6; }
  .pp-row { display: flex; gap: 8px; margin: 10px 0 8px; }
  .pp-row button { border-radius: 7px; padding: 5px 14px; font-size: 11.5px; cursor: pointer;
    border: 1px solid var(--btn-bd); background: var(--btn-bg); color: var(--btn-text); }
  #pp-save { background: var(--accent); border-color: var(--accent); color: #fff; }
  html[data-theme="dark"] #pp-save { background: #2a5a9c; border-color: #2a5a9c; color: #e8eef6; }
  .pp-hint { font-size: 10.5px; color: var(--text-faint); line-height: 1.65; }
  body:not(.has-profile) .bbtn[data-act="rewrite"] { display: none; }
  .bx-tools, .tn-tools { display: inline-flex; gap: 8px; align-items: center; }
  .bx-tools { display: flex; margin-top: 7px; }
  .rw-badge { font-size: 9px; color: var(--accent); border: 1px solid var(--accent);
    border-radius: 99px; padding: 0 7px; line-height: 1.6; flex: none; opacity: .85; }

  /* ---- wires ---- */
  #wires { position: absolute; left: 0; top: 0; z-index: 3; pointer-events: none; overflow: visible; }
  .wire { fill: none; transition: opacity .3s; }
  .wire.call { stroke: var(--wire-call); stroke-width: 1.6; }
  .wire.data { stroke: var(--wire-data); stroke-width: 1.6; }
  .wire.off { opacity: .09; }
  .wire.on.call { stroke: var(--wire-call-on); stroke-width: 2.6; }
  .wire.on.data { stroke: var(--wire-data-on); stroke-width: 2.6; }
  .port.call { fill: var(--wire-call); } .port.data { fill: var(--wire-data); }
  .port.on.call { fill: var(--wire-call-on); } .port.on.data { fill: var(--wire-data-on); }
  .port.off { opacity: .09; }
  .leader { stroke: var(--leader); stroke-width: 1; stroke-dasharray: 3 4; opacity: .75; fill: none; }
  .leader.off { opacity: .12; }
  .wlabel { font: 10.5px -apple-system, sans-serif; fill: var(--wire-data); }
  .wlabel.on { fill: var(--wire-data-on); font-weight: 600; }
  .wlabel.off { opacity: .09; }

  /* ---- chrome ---- */
  #topbar { position: fixed; top: 14px; left: 18px; z-index: 10; }
  #topbar h1 { font-size: 14px; font-weight: 600; color: var(--fname); margin-bottom: 6px; }
  #topbar h1 small { color: var(--text-faint); font-weight: 400; margin-left: 8px; }
  .legend { display: flex; gap: 16px; font-size: 11px; color: var(--text-dim); align-items: center; }
  .sw { display: inline-block; width: 22px; height: 0; border-top: 2px solid; margin-right: 5px;
    vertical-align: middle; }
  .sw-call { border-color: var(--wire-call); }
  .sw-data { border-color: var(--wire-data); }
  .sw-leader { border-color: var(--leader); border-top-style: dashed; }
  .sw-add { border-color: var(--add-bar); }
  .sw-del { border-color: var(--del-no); }

</style>
</head>
<body>

例：刚接手推理服务的后端，Python 一般；重点想懂显存管理；多用类比，中文。"></textarea>

<script>
const DATA = {"meta": {"title": "缓存防雪崩 PR", "subtitle": "diff 画布示例 · TTL 抖动 + singleflight 击穿锁", "audience": "评审这个 PR 的后端工程师；中文；关注正确性与回归风险", "mode": "diff"}, "regions": [{"id": "A", "title": "故事线 A · 本次变更", "blurb": "两招：过期时刻打散、热 key 只放一个回源", "hue": "amber", "cards": ["handler", "jittered", "store"]}, {"id": "B", "title": "故事线 B · 未改动的邻居", "blurb": "变更周边的上下文，读懂连锁影响用", "hue": "blue", "cards": ["get", "fetch"]}], "cards": [{"id": "handler", "name": "handle_request(req)", "file": "server/handler.py:12", "lang": "py", "layout": {"col": 0, "band": 0}, "collapsed": false, "code": "def handle_request(req):\n    key = cache_key(req)\n    cached = get_cached(key)\n    if cached is not None:\n        metrics.hit()\n        return cached\n    with keyed_lock(key):\n        cached = get_cached(key)\n        if cached is not None:\n            return cached\n        resp = fetch_upstream(req)\n        store(key, resp, ttl=req.ttl)\n    return resp", "diff": {"added": [7, 8, 9, 10, 11, 12], "removed": [{"after": 6, "code": "    resp = fetch_upstream(req)"}, {"after": 6, "code": "    store(key, resp, ttl=req.ttl)"}]}, "terms": [{"line": 7, "token": "keyed_lock", "note": "进程内按 key 的互斥锁：同一 key 的并发未命中只放一个去回源，其余等它回填。"}]}, {"id": "jittered", "name": "jittered(ttl)", "file": "server/cache.py:9", "lang": "py", "layout": {"col": 1, "band": 0}, "collapsed": false, "code": "def jittered(ttl):\n    return ttl * random.uniform(0.9, 1.1)", "diff": {"added": [1, 2], "removed": []}}, {"id": "store", "name": "store(key, resp, ttl)", "file": "server/cache.py:14", "lang": "py", "layout": {"col": 1, "band": 1}, "collapsed": false, "code": "def store(key, resp, ttl):\n    ttl = jittered(ttl)\n    _table[key] = Entry(resp, now() + ttl)\n    _evict_if_needed()", "diff": {"added": [2], "removed": []}}, {"id": "get", "name": "get_cached(key)", "file": "server/cache.py:24", "lang": "py", "layout": {"col": 2, "band": 0}, "collapsed": true, "code": "def get_cached(key):\n    entry = _table.get(key)\n    if entry is None or entry.expired():\n        return None\n    return entry.value"}, {"id": "fetch", "name": "fetch_upstream(req)", "file": "server/upstream.py:31", "lang": "py", "layout": {"col": 2, "band": 2}, "collapsed": true, "code": "def fetch_upstream(req):\n    conn = pool.acquire(req.host)\n    try:\n        return conn.send(req)\n    finally:\n        pool.release(conn)"}], "wires": [{"id": "w-get", "kind": "call", "from": {"card": "handler", "line": 3}, "to": {"card": "get"}}, {"id": "w-fetch", "kind": "call", "from": {"card": "handler", "line": 11}, "to": {"card": "fetch", "side": "left"}}, {"id": "w-store", "kind": "call", "from": {"card": "handler", "line": 12}, "to": {"card": "store"}}, {"id": "w-jit", "kind": "call", "from": {"card": "store", "line": 2, "side": "left"}, "to": {"card": "jittered", "side": "left"}}, {"id": "d-resp", "kind": "data", "label": "resp", "from": {"card": "fetch", "line": 4, "side": "left"}, "to": {"card": "store", "side": "right"}}], "notes": [{"id": "bg0", "flavor": "bg", "tag": "背景 · 这个 PR 治什么病", "text": "雪崩：大批 key 同秒过期，回源洪峰打垮上游；击穿：热 key 过期瞬间并发全部回源。本 PR 各用一招：TTL 抖动打散过期，singleflight 锁同 key 并发。", "place": {"corner": "nw"}, "step": 0}, {"id": "n-jit", "flavor": "intent", "tag": "NOTE · cache.py:10", "text": "抖动窗口 ±10%：足够打散过期时刻，又不至于让 TTL 明显失真。", "anchor": {"card": "jittered", "line": 2}, "place": {"side": "left", "of": "jittered"}, "step": 1}, {"id": "n-dc", "flavor": "intent", "tag": "NOTE · handler.py:19", "text": "双重检查：拿到锁先再查一次缓存——排队期间别人可能已经回填了。", "anchor": {"card": "handler", "line": 8}, "place": {"side": "left", "of": "handler"}, "step": 2}, {"id": "n-risk", "flavor": "intent", "tag": "风险 · 观测与告警", "text": "jittered 之后 TTL 观测值 ≠ 配置值：监控里按 ttl 精确值报警的规则会误报，要跟着改。", "anchor": {"card": "store", "line": 2}, "place": {"side": "left", "of": "store"}, "step": 3, "severity": "concern"}, {"id": "n-floor", "flavor": "intent", "severity": "nit", "tag": "发现 · cache.py:10", "text": "uniform(0.9, 1.1) 在 ttl 很小时抖动后可能取整成 0（永不缓存）。建议加下界：max(1, …)。", "anchor": {"card": "jittered", "line": 2}, "place": {"side": "left", "of": "jittered"}, "step": 3}], "steps": [{"title": "总览", "caption": "一个防雪崩 PR 的评审画布：绿 = 新增行，红删除线 = 被删原文，卡头有 +/− 统计。三步走：这个 PR 治什么病 → 抖动 → 击穿锁 → 风险。", "fit": true}, {"title": "① TTL 抖动", "storyline": "A", "caption": "store 写入前把 TTL 过一遍 jittered()：±10% 均匀抖动，同批写入的 key 过期时刻被打散——雪崩的「同秒过期」前提直接消失。", "wires": ["w-jit"], "lines": [["store", 2], ["jittered", 2]], "focus": ["store", "jittered", "n-jit"]}, {"title": "② singleflight 击穿锁", "storyline": "A", "caption": "未命中路径包进 keyed_lock：同一 key 只放一个请求去回源，其余排队。注意被删的原文——原来是裸奔直接回源。拿到锁先做双重检查。", "wires": ["w-fetch", "w-store"], "lines": [["handler", 7], ["handler", 8], ["handler", 9], ["handler", 10]], "focus": ["handler", "n-dc", "fetch"]}, {"title": "③ 回归风险", "storyline": "A", "caption": "三个要盯的点：TTL 观测值偏离配置值，告警规则要改；keyed_lock 持锁含整个回源耗时，慢上游会堆积排队；抖动无下界，极小 ttl 可能归零。", "wires": ["w-store", "w-jit"], "lines": [["store", 2]], "focus": ["store", "n-risk", "n-floor", "jittered"]}]};

const vp = document.getElementById('vp');
const world = document.getElementById('world');
const svg = document.getElementById('wires');
const NS = 'http://www.w3.org/2000/svg';

if (!DATA) {
  document.getElementById('stitle').textContent = '未注入数据';
  document.getElementById('scap').textContent = '用 render.py 将 canvas JSON 注入此模板。';
  throw new Error('no data');
}

/* ================= syntax highlighting ================= */
const KW = {
  py: 'def return if elif else for while in is not None True False and or with try except finally continue break class import from as lambda yield raise pass global nonlocal assert del await async',
  js: 'function return if else for while const let var new class import from export try catch finally throw await async of in typeof instanceof null undefined true false break continue switch case default do yield delete void this super extends static get set',
};
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function highlight(line, lang) {
  const kws = (KW[lang] || KW.py).split(' ');
  const re = new RegExp(
    '(#.*$|\\/\\/.*$)'                                     // comment
    + '|("(?:[^"\\\\]|\\\\.)*"|\'(?:[^\'\\\\]|\\\\.)*\')'  // string
    + '|\\b(' + kws.join('|') + ')\\b'                     // keyword
    + '|\\b(\\d+(?:\\.\\d+)?)\\b'                          // number
    + '|([A-Za-z_][A-Za-z0-9_]*)(?=\\()',                  // call
    'g');
  return esc(line).replace(re, (m, c, s, k, n, f) => {
    if (c) return `<span class="cmt">${c}</span>`;
    if (s) return `<span class="str">${s}</span>`;
    if (k) return `<span class="kw">${k}</span>`;
    if (n) return `<span class="num">${n}</span>`;
    if (f) return `<span class="fn">${f}</span>`;
    return m;
  });
}

/* ================= build DOM ================= */
const HUE_NAMES = ['blue', 'green', 'violet', 'amber'];
const HUE_LB = {
  light: { blue: '#0969da', green: '#1a7f37', violet: '#8250df', amber: '#9a6700' },
  dark:  { blue: '#79a8ff', green: '#56c98a', violet: '#b39dfc', amber: '#e0b45c' },
};
function curTheme() { return document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light'; }
function hueLb(name) { return HUE_LB[curTheme()][HUE_NAMES.includes(name) ? name : 'blue']; }
function rgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
}

document.getElementById('t-title').firstChild.textContent = (DATA.meta?.title || 'Code Canvas') + ' ';
document.getElementById('t-sub').textContent = DATA.meta?.subtitle || '';
document.title = DATA.meta?.title || 'Code Canvas';

/* regions (positioned later) */
for (const r of DATA.regions || []) {
  const el = document.createElement('div');
  el.className = 'region hue-' + (HUE_NAMES.includes(r.hue) ? r.hue : 'blue');
  el.id = 'reg-' + r.id;
  el.innerHTML = `<span class="rlabel">${esc(r.title)}</span>`
    + (r.blurb ? `<span class="rblurb">${esc(r.blurb)}</span>` : '');
  world.appendChild(el);
}

/* cards: lines + nested block tree */
function buildBlocks(blocks, lines, lo, hi, cardId, depth) {
  // returns HTML for line range [lo, hi] with blocks interleaved
  let html = '', i = lo;
  const blks = (blocks || []).slice().sort((a, b) => a.lines[0] - b.lines[0]);
  for (const b of blks) {
    for (; i < b.lines[0]; i++) html += lines[i - 1];
    const pi = Math.min(depth, 1), ci = b._idx % (pi ? 4 : 5);
    const btns = (b.explain ? `<span class="bbtn" style="margin-left:auto" data-act="explain">说明</span>` : '')
      + `<span class="bbtn"${b.explain ? '' : ' style="margin-left:auto"'} data-act="ask">问</span>`;
    html += `<div class="blk bp${pi}-${ci}${b.folded !== false ? ' folded' : ''}">`
      + `<div class="bbar" data-card="${cardId}" data-bname="${esc(b.name)}">`
      + `<span class="bchev">${b.folded !== false ? '▸' : '▾'}</span>`
      + `<span class="bname">${esc(b.name)}</span><span class="bsum">${esc(b.summary || '')}</span>`
      + btns + `<span class="brange">${b.lines[0]}–${b.lines[1]}</span></div>`
      + (b.explain ? `<div class="bxplain" data-card="${cardId}" data-bname="${esc(b.name)}">`
        + `<span class="bx-text">${esc(b.explain)}</span>`
        + `<div class="bx-tools"><span class="bbtn" data-act="rewrite">按我的画像重讲</span></div></div>` : '')
      + `<div class="bcode">`
      + buildBlocks(b.children, lines, b.lines[0], b.lines[1], cardId, depth + 1)
      + `</div></div>`;
    i = b.lines[1] + 1;
  }
  for (; i <= hi; i++) html += lines[i - 1];
  return html;
}
function escRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
const cardById = {};
for (const c of DATA.cards) {
  cardById[c.id] = c;
  const raw = c.code.split('\n');
  const diff = c.diff || {};
  const addSet = new Set(diff.added || []);
  const delAfter = {};
  (diff.removed || []).forEach(r => (delAfter[r.after] ||= []).push(r.code));
  const delHtml = k => (delAfter[k] || []).map(t =>
    `<div class="ln del"><span class="no">−</span>${esc(t)}</div>`).join('');
  const lineHtml = raw.map((t, i) => {
    // mark annotated terms with sentinels before highlighting, wrap after
    let marked = t;
    const terms = (c.terms || []).map((tm, j) => ({ ...tm, _id: `tn-${c.id}-${j}`, _j: j }))
      .filter(tm => tm.line === i + 1);
    for (const tm of terms)
      marked = marked.replace(new RegExp('\\b' + escRe(tm.token) + '\\b'), '\x01' + tm.token + '\x02');
    let h = highlight(marked, c.lang);
    for (const tm of terms) {
      h = h.replace('\x01', `<span class="term" data-tn="${tm._id}">`).replace('\x02', '</span>');
    }
    const notes = terms.map(tm =>
      `<div class="tnote" id="${tm._id}" data-card="${c.id}" data-tid="${tm._j}">`
      + `<b>${esc(tm.token)}</b> — <span class="tn-text">${esc(tm.note)}</span> `
      + `<span class="tn-tools"><span class="bbtn" data-act="rewrite">重讲</span></span></div>`).join('');
    return (i === 0 ? delHtml(0) : '')
      + `<div class="ln${addSet.has(i + 1) ? ' add' : ''}" id="${c.id}-L${i + 1}"><span class="no">${i + 1}</span>${h}</div>`
      + delHtml(i + 1) + notes;
  });
  (c.blocks || []).forEach((b, i) => { b._idx = i; (function mark(bs) { (bs || []).forEach((x, j) => { x._idx = j; mark(x.children); }); })(b.children); });
  const el = document.createElement('div');
  el.className = 'card';
  el.id = 'card-' + c.id;
  const badge = c.diff
    ? `<span class="dbadge"><b>+${(diff.added || []).length}</b> <i>−${(diff.removed || []).length}</i></span>` : '';
  el.innerHTML = `<div class="hdr"><span class="chev">▾</span><span class="fname">${esc(c.name)}</span>${badge}`
    + `<span class="file">${esc(c.file || '')}</span></div>`
    + `<div class="body">${buildBlocks(c.blocks, lineHtml, 1, raw.length, c.id, 0)}</div>`;
  world.appendChild(el);
}
if (DATA.cards.some(c => c.diff)) {
  document.querySelector('.legend').insertAdjacentHTML('beforeend',
    `<span><span class="sw sw-add"></span>新增行</span>`
    + `<span><span class="sw sw-del"></span>删除的原文</span>`);
}

/* notes; a severity marks a note as a review finding */
for (const n of DATA.notes || []) {
  const el = document.createElement('div');
  el.className = 'note' + (n.flavor === 'bg' ? ' bg' : '');
  el.id = 'note-' + n.id;
  el.dataset.step = n.step ?? '';
  const sev = n.severity ? `<span class="sev ${esc(n.severity)}">${esc(n.severity)}</span>` : '';
  el.innerHTML = `<div class="tag">${esc(n.tag || 'NOTE')}${sev}</div>${esc(n.text)}`;
  world.appendChild(el);
}
/* findings tally: click cycles the camera through severity-tagged notes */
const FINDINGS = (DATA.notes || []).filter(n => n.severity);
if (FINDINGS.length) {
  const counts = {};
  FINDINGS.forEach(n => counts[n.severity] = (counts[n.severity] || 0) + 1);
  const chip = document.createElement('div');
  chip.id = 'findings';
  chip.innerHTML = '发现：' + ['blocker', 'concern', 'nit']
    .filter(s => counts[s]).map(s => `<b class="${s}">${counts[s]} ${s}</b>`).join(' · ');
  chip.title = '点击逐个跳转';
  document.body.appendChild(chip);
  let fi = -1;
  chip.addEventListener('click', () => {
    fi = (fi + 1) % FINDINGS.length;
    const n = FINDINGS[fi];
    const el = document.getElementById('note-' + n.id);
    document.querySelectorAll('.note.hot').forEach(x => x.classList.remove('hot'));
    el.classList.remove('dim');
    el.classList.add('hot');
    focusOn([n.id]);
    drawWires();
  });
}

/* ================= layout ================= */
const L = { margin: 40, top: 160, gutter: 230, bandH: 280, vGap: 90,
  noteW: 250, noteGap: 60, regPadX: 30, regPadTop: 46, regPadBot: 26 };

function layout() {
  // measure natural card widths (expanded, unfolded)
  for (const c of DATA.cards) {
    const el = document.getElementById('card-' + c.id);
    el.classList.remove('collapsed');
    el.querySelectorAll('.blk').forEach(b => b.classList.remove('folded'));
    el.style.width = 'max-content';
    c._w = Math.min(el.offsetWidth + 2, 800);
  }
  // apply default states + fixed widths
  for (const c of DATA.cards) {
    const el = document.getElementById('card-' + c.id);
    el.style.width = c._w + 'px';
    if (c.collapsed) { el.classList.add('collapsed'); el.querySelector('.chev').textContent = '▸'; }
    el.querySelectorAll('.blk').forEach(b => b.classList.add('folded'));
    el.querySelectorAll('.bchev').forEach(v => v.textContent = '▸');
    // honor explicit folded:false
    applyFoldDefaults(c);
  }
  // columns; a column whose cards have left-notes gets a note lane in front of it
  const hasLeftNotes = (DATA.notes || []).some(n => n.place
    && (n.place.corner || (n.place.side === 'left' && cardById[n.place.of]?.layout.col === 0)));
  const leftNoteCols = new Set();
  for (const n of DATA.notes || []) if (n.place && n.place.side === 'left') {
    const t = cardById[n.place.of];
    if (t && t.layout.col > 0) leftNoteCols.add(t.layout.col);
  }
  const cols = {};
  for (const c of DATA.cards) (cols[c.layout.col] ||= []).push(c);
  let x = L.margin + (hasLeftNotes ? L.noteW + 80 : 0);
  const colX = {};
  for (const k of Object.keys(cols).map(Number).sort((a, b) => a - b)) {
    if (leftNoteCols.has(k)) x += L.noteW + 70;
    colX[k] = x;
    x += Math.max(...cols[k].map(c => c._w)) + L.gutter;
  }
  // x + base y from coarse hints; dynamic push-down happens on every draw
  for (const c of DATA.cards) {
    const el = document.getElementById('card-' + c.id);
    el.style.left = colX[c.layout.col] + 'px';
    c._x = colX[c.layout.col];
    c._baseY = L.top + c.layout.band * L.bandH;
  }
  relayoutColumns();
  placeNotes();
  fitRegions();
  sizeWorld();
}
/* notes follow their target cards on every redraw; an "above" note squeezed
   out by an expanding card slides down, and falls back to hanging left of
   its target when there is no room at all */
function placeNotes() {
  const leftSlots = {};
  for (const n of DATA.notes || []) {
    const el = document.getElementById('note-' + n.id);
    const p = n.place || {};
    if (p.corner === 'nw') { el.style.left = L.margin + 'px'; el.style.top = (L.top - 40) + 'px'; continue; }
    const target = cardById[p.of];
    const tEl = target && document.getElementById('card-' + target.id);
    if (!tEl) { el.style.left = L.margin + 'px'; el.style.top = L.top + 'px'; continue; }
    const ty = tEl.offsetTop, h = el.offsetHeight;
    if (p.side === 'above') {

  while (e && e !== cardEl) { if (e.classList.contains('blk')) chain.unshift(e); e = e.parentElement; }

    const k = Math.min(Math.max(Math.abs(b.x - a.x) * .55, Math.abs(b.y - a.y) * .25, 30), 170);
    const c1 = { x: a.x + (a.side === 'right' ? k : -k), y: a.y };
    const c2 = { x: b.x + (b.side === 'right' ? k : -k), y: b.y };

    const path = document.createElementNS(NS, 'path');
    path.setAttribute('d', `M ${a.x} ${a.y} C ${c1.x} ${c1.y}, ${c2.x} ${c2.y}, ${b.x} ${b.y}`);
    path.setAttribute('class', `wire ${w.kind}${state}`);

      c.setAttribute('cx', pt.x); c.setAttribute('cy', pt.y);

    const p = document.createElementNS(NS, 'path');

let cam = { x: 0, y: 0, s: .8 };
function apply(animate = true) {

}
function centerOn(wx, wy, s, animate = true) {
  cam.s = s;

  cam.y = (innerHeight - 70) / 2 - wy * s;

function fitAll(animate = true) {
  // never crop the overview — wide canvases fit at whatever scale it takes
  const b = contentBBox();
  const s = Math.min(Math.min(innerWidth / (b.x1 - b.x0 + 60), (innerHeight - 110) / (b.y1 - b.y0 + 60)) * .98, 1.15);
  centerOn((b.x0 + b.x1) / 2, (b.y0 + b.y1) / 2, Math.max(s, .1), animate);

    if (!el) continue;
    const p = wpos(el);
    x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y);

}

/* ================= steps ================= */
function setStep(i, animate = true) {
  step = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[step];
  (s.expand || []).forEach(id => {
    const el = document.getElementById('card-' + id);
    el.classList.remove('collapsed');
    el.querySelector('.chev').textContent = '▾';
  });
  (s.unfold || []).forEach(([cid, name]) => {
    const blk = [...document.getElementById('card-' + cid).querySelectorAll('.blk')]
      .find(e => e.querySelector('.bname').textContent === name);
    if (blk) { blk.classList.remove('folded'); blk.querySelector('.bchev').textContent = '▾'; }
  });
  document.querySelectorAll('.ln.hot').forEach(e => e.classList.remove('hot'));
  (s.lines || []).forEach(([cid, ln]) => {
    const e = document.getElementById(cid + '-L' + ln);
    if (e) e.classList.add('hot');
  });
  const activeCards = new Set();
  if (s.wires) for (const w of DATA.wires || []) if (s.wires.includes(w.id)) {
    activeCards.add(w.from.card); activeCards.add(w.to.card);
  }
  document.querySelectorAll('.card').forEach(c =>
    c.classList.toggle('dim', s.wires ? !activeCards.has(c.id.slice(5)) : false));
  document.querySelectorAll('.note').forEach(n => {
    const mine = n.dataset.step !== '' && +n.dataset.step === step;
    n.classList.toggle('hot', mine);
    n.classList.toggle('dim', step > 0 && !mine);
  });
  // settle the layout before computing the camera — a card expanded by this
  // step changes heights, and framing must use post-relayout positions
  relayoutColumns();
  placeNotes();
  if (s.fit || !s.focus) fitAll(animate); else focusOn(s.focus, animate);
  drawWires();
  const reg = (DATA.regions || []).find(r => r.id === s.storyline);
  const lb = reg && hueLb(reg.hue);
  document.getElementById('stitle').innerHTML =
    (reg ? `<span class="schip" style="color:${lb}; border-color:${lb}">${esc(reg.title.replace(/^故事线\s*/, ''))}</span>` : '')
    + esc(s.title || '');
  document.getElementById('scap').textContent = s.caption || '';
  document.getElementById('prev').disabled = step === 0;
  document.getElementById('next').disabled = step === STEPS.length - 1;
  document.querySelectorAll('.dot').forEach((d, j) => {
    d.classList.toggle('cur', j === step);

function findBlock(blocks, name) {

const PROFILE_KEY = 'canvas-reader-profile';

function setProfile(v) {

      ctx: `卡片: ${card.name}（${card.file || ''}）\n逻辑块: ${b.name} — ${b.summary || ''}\n块内代码:\n`

  }
  const prompt = `把下面这段代码注释改写给特定读者。保持事实与代码依据不变，只调整讲法、详略、术语和语言风格；长度不超过原文两倍；只输出改写后的正文，不要任何前后缀。\n\n读者画像: ${profile}\n\n${ctx}\n\n原注释: ${orig}`;

}
async function sendQA() {
  const input = document.getElementById('qa-input');
  const q = input.value.trim();
  if (!q || !QA.cur) return;
  input.value = '';
  const entry = { q, a: '', busy: true };
  (QA.log[qaKey()] ||= []).push(entry);
  const prompt = buildQAPrompt(q);
  if (!QA.live) {
    try {
      await navigator.clipboard.writeText(prompt);
      entry.a = '已复制完整上下文提问到剪贴板 ✓ 粘贴给你的 agent 即可。';
    } catch (e) {
      entry.a = '复制失败（浏览器限制）。启动 serve.py 使用在线问答。';
      entry.err = true;
    }
    entry.busy = false;
    renderQALog();
    return;
  }
  entry.a = '思考中…';
  renderQALog();
  document.getElementById('qa-send').disabled = true;
  try {
    const r = await fetch('ask', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt, card: QA.cur.card, block: QA.cur.block, question: q }),
    });
    const j = await r.json();
    if (j.ok) entry.a = j.answer;
    else { entry.a = '出错了：' + (j.error || '未知错误'); entry.err = true; }
  } catch (e) {
    entry.a = '请求失败：' + e.message; entry.err = true;
  }
  entry.busy = false;
  document.getElementById('qa-send').disabled = false;
  try { localStorage.setItem(QA_STORE, JSON.stringify(QA.log)); } catch (e) {}
  renderQALog();
}
document.getElementById('qa-close').onclick = closeQA;
document.getElementById('qa-send').onclick = sendQA;
document.getElementById('qa-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendQA(); }
  e.stopPropagation();
});

/* ================= interactions ================= */
world.addEventListener('click', e => {
  const term = e.target.closest('.term');
  if (term) {
    const note = document.getElementById(term.dataset.tn);
    term.classList.toggle('on');
    note.classList.toggle('open');
    drawWires(); return;
  }
  const btn = e.target.closest('.bbtn');
  if (btn) {
    const act = btn.dataset.act;
    if (act === 'rewrite') { rewriteEl(btn.closest('.bxplain, .tnote'), btn.textContent === '重新生成'); return; }
    if (act === 'revert') { revertEl(btn.closest('.bxplain, .tnote')); return; }
    const bar = btn.closest('.bbar');
    if (act === 'explain') {
      bar.parentElement.classList.toggle('explained');
      drawWires();
    } else {
      openQA(bar.dataset.card, bar.dataset.bname);
    }
    return;
  }
  const bar = e.target.closest('.bbar');
  if (bar) {
    const blk = bar.parentElement;
    blk.classList.toggle('folded');
    bar.querySelector('.bchev').textContent = blk.classList.contains('folded') ? '▸' : '▾';
    drawWires(); return;
  }
  const hdr = e.target.closest('.hdr');
  if (hdr) {
    const card = hdr.closest('.card');
    card.classList.toggle('collapsed');
    hdr.querySelector('.chev').textContent = card.classList.contains('collapsed') ? '▸' : '▾';
    drawWires();
  }
});
/* Pan starts only after real movement (>4px). Capturing on pointerdown would
   retarget the click event to the viewport and swallow clicks on terms, bars,
   headers etc. — so a still pointer is a click, a moved pointer is a drag.
   Two pointers = pinch zoom (touch); capture immediately, no click semantics. */
let drag = null, pinch = null;
const pts = new Map();
function pinchState() {
  const [a, b] = [...pts.values()];
  return { d: Math.hypot(a.x - b.x, a.y - b.y), cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2 };
}
vp.addEventListener('pointerdown', e => {
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pts.size === 2) {
    drag = null;
    pinch = { ...pinchState(), s0: cam.s, x0: cam.x, y0: cam.y };
    world.classList.add('notrans');
    for (const id of pts.keys()) { try { vp.setPointerCapture(id); } catch (err) {} }
  } else if (pts.size === 1) {
    drag = { sx: e.clientX, sy: e.clientY, ox: cam.x, oy: cam.y, moved: false, id: e.pointerId };
  }
});
vp.addEventListener('pointermove', e => {
  if (pts.has(e.pointerId)) pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pts.size === 2) {
    const p = pinchState();
    const ns = Math.min(1.8, Math.max(.1, pinch.s0 * (p.d / (pinch.d || 1))));
    cam.x = p.cx - (pinch.cx - pinch.x0) * (ns / pinch.s0);
    cam.y = p.cy - (pinch.cy - pinch.y0) * (ns / pinch.s0);
    cam.s = ns;
    apply(false);
    return;
  }
  if (!drag) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (!drag.moved) {
    if (Math.abs(dx) + Math.abs(dy) <= 4) return;
    drag.moved = true;
    vp.classList.add('dragging');
    vp.setPointerCapture(drag.id);
  }
  cam.x = drag.ox + dx;
  cam.y = drag.oy + dy;
  apply(false);
});
function endPointer(e) {
  pts.delete(e.pointerId);
  if (pts.size < 2) pinch = null;
  if (pts.size === 0) { drag = null; vp.classList.remove('dragging'); }
}
vp.addEventListener('pointerup', endPointer);
vp.addEventListener('pointercancel', endPointer);
vp.addEventListener('wheel', e => {
  e.preventDefault();
  const f = Math.exp(-e.deltaY * .0012);
  const ns = Math.min(1.8, Math.max(.1, cam.s * f));
  cam.x = e.clientX - (e.clientX - cam.x) * (ns / cam.s);
  cam.y = e.clientY - (e.clientY - cam.y) * (ns / cam.s);
  cam.s = ns;
  apply(false);
}, { passive: false });
addEventListener('resize', () => { drawWires(); if (STEPS[step].fit) fitAll(false); });

/* ================= init =================
   #s2 jumps to step 2; trailing debug letters: x = unfold everything,
   e = open all block explanations, t = open all term notes, q = open Q&A drawer */
const m = location.hash.match(/^#s(\d+)([a-z]*)$/);
const flags = m ? m[2] : '';
requestAnimationFrame(() => {
  layout();
  if (flags.includes('x')) document.querySelectorAll('.blk, .card').forEach(b => {
    b.classList.remove('folded'); b.classList.remove('collapsed');
    const v = b.querySelector('.bchev, .chev'); if (v) v.textContent = '▾';
  });
  if (flags.includes('e')) document.querySelectorAll('.blk').forEach(b => {
    if (b.querySelector(':scope > .bxplain')) b.classList.add('explained');
  });
  if (flags.includes('t')) document.querySelectorAll('.tnote').forEach(n => n.classList.add('open'));
  setStep(m ? +m[1] : 0, false);
  if (flags.includes('q')) {
    const bar = document.querySelector('.bbar');
    if (bar) openQA(bar.dataset.card, bar.dataset.bname);
  }
});
</script>
