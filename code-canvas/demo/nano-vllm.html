<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Canvas</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #111418; color: #c9d1d9;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }

  #vp { position: fixed; inset: 0; overflow: hidden; cursor: grab; }
  #vp.dragging { cursor: grabbing; }
  #world { position: absolute; transform-origin: 0 0;
    transition: transform .55s cubic-bezier(.22,.9,.26,1);
    background-image: radial-gradient(circle, #1c212a 1px, transparent 1px);
    background-size: 28px 28px; }
  #world.notrans { transition: none; }

  /* ---- storyline regions ---- */
  .region { position: absolute; border-radius: 18px; border: 1.5px dashed; z-index: 0; }
  .rlabel { position: absolute; top: -12px; left: 20px; padding: 2px 12px; font-size: 11px;
    border-radius: 99px; background: #151a20; letter-spacing: .5px; border: 1px solid; }
  .rblurb { position: absolute; top: 12px; left: 22px; font-size: 11px; opacity: .78;
    letter-spacing: .3px; }

  /* ---- code cards ---- */
  .card { position: absolute; background: #1b2027; border: 1px solid #39414d; border-radius: 10px;
    box-shadow: 0 8px 22px rgba(0,0,0,.38); z-index: 2; transition: opacity .35s; overflow: hidden; }
  .card .hdr { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #232a33;
    border-bottom: 1px solid #333b47; border-radius: 10px 10px 0 0; cursor: pointer; white-space: nowrap; }
  .card.collapsed .hdr { border-bottom: none; border-radius: 10px; }
  .card.collapsed .body { display: none; }
  .chev { color: #6f7d90; font-size: 9px; width: 10px; flex: none; }
  .fname { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px;
    color: #e3e9f2; font-weight: 600; }
  .file { margin-left: auto; color: #5d6875; font-size: 10px; padding-left: 14px; }
  .body { padding: 8px 0; }
  .ln { white-space: pre; font: 12px/1.75 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    padding: 0 14px 0 10px; }
  .ln .no { display: inline-block; width: 20px; text-align: right; margin-right: 12px;
    color: #4d5663; user-select: none; }
  .ln.hot { background: rgba(88,166,255,.10); box-shadow: inset 2px 0 0 #58a6ff; }
  .kw { color: #ff7b72; } .fn { color: #d2a8ff; } .str { color: #a5d6ff; }
  .num { color: #79c0ff; } .cmt { color: #7d8590; }
  .card.dim { opacity: .32; }

  /* ---- intra-function logical blocks ---- */
  .blk { border-left: 3px solid var(--bc); background: var(--bt); margin: 3px 0 3px 8px;
    border-radius: 0 6px 6px 0; }
  .blk .ln { padding-left: 6px; }
  .bbar { display: flex; align-items: baseline; gap: 7px; padding: 3px 10px 3px 7px;
    cursor: pointer; font-size: 10.5px; line-height: 1.7; white-space: nowrap; }
  .bbar:hover { background: rgba(255,255,255,.035); }
  .bchev { color: var(--bc); font-size: 8px; }
  .bname { color: var(--bc); font-weight: 600; }
  .bsum { color: #8b95a5; }
  .brange { margin-left: auto; color: #566070; font-size: 9.5px; padding-left: 14px;
    font-family: ui-monospace, Menlo, Consolas, monospace; }
  .blk.folded > .bcode { display: none; }

  /* ---- notes ---- */
  .note { position: absolute; width: 250px; background: #26221a; border: 1px solid #55492f;
    border-left: 3px solid #b08d3f; border-radius: 8px; padding: 9px 12px; font-size: 11.5px;
    line-height: 1.65; color: #d0c3a2; z-index: 4; transition: opacity .35s; }
  .note .tag { font-size: 9.5px; color: #8f7d52; margin-bottom: 3px; letter-spacing: 1px; }
  .note.hot { border-color: #c8a45a; border-left-color: #e0b45c; color: #ecdfbc;
    box-shadow: 0 0 0 1px rgba(200,164,90,.35), 0 8px 20px rgba(0,0,0,.45); }
  .note.dim { opacity: .32; }
  .note.bg { background: #1b2330; border-color: #324459; border-left-color: #57a6c8; color: #a4bfd2; }
  .note.bg .tag { color: #5c86a0; }
  .note.bg.hot { border-color: #57a6c8; border-left-color: #6fc0e0; color: #cfe4f2;
    box-shadow: 0 0 0 1px rgba(87,166,200,.32), 0 8px 20px rgba(0,0,0,.45); }

  /* ---- wires ---- */
  #wires { position: absolute; left: 0; top: 0; z-index: 3; pointer-events: none; overflow: visible; }
  .wire { fill: none; transition: opacity .3s; }
  .wire.call { stroke: #8fa0b5; stroke-width: 1.6; }
  .wire.data { stroke: #dfa23e; stroke-width: 1.6; }
  .wire.off { opacity: .09; }
  .wire.on.call { stroke: #dbe6f4; stroke-width: 2.6; }
  .wire.on.data { stroke: #ffc46b; stroke-width: 2.6; }
  .port.call { fill: #8fa0b5; } .port.data { fill: #dfa23e; }
  .port.on.call { fill: #dbe6f4; } .port.on.data { fill: #ffc46b; }
  .port.off { opacity: .09; }
  .leader { stroke: #8f7d52; stroke-width: 1; stroke-dasharray: 3 4; opacity: .75; fill: none; }
  .leader.off { opacity: .12; }
  .wlabel { font: 10.5px -apple-system, sans-serif; fill: #dfa23e; }
  .wlabel.on { fill: #ffc46b; font-weight: 600; }
  .wlabel.off { opacity: .09; }

  /* ---- chrome ---- */
  #topbar { position: fixed; top: 14px; left: 18px; z-index: 10; }
  #topbar h1 { font-size: 14px; font-weight: 600; color: #e3e9f2; margin-bottom: 6px; }
  #topbar h1 small { color: #6b7684; font-weight: 400; margin-left: 8px; }
  .legend { display: flex; gap: 16px; font-size: 11px; color: #9aa4b2; align-items: center; }
  .sw { display: inline-block; width: 22px; height: 0; border-top: 2px solid; margin-right: 5px;
    vertical-align: middle; }
  #hint { position: fixed; top: 16px; right: 18px; z-index: 10; font-size: 11px; color: #5d6875;
    text-align: right; line-height: 1.7; }

  #bar { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 10;
    display: flex; align-items: center; gap: 14px; padding: 11px 16px;
    background: rgba(18,22,28,.93); border: 1px solid #313945; border-radius: 14px;
    max-width: min(880px, 95vw); backdrop-filter: blur(6px); }
  .navbtn { background: #2a323d; border: 1px solid #3c4653; color: #c9d1d9; border-radius: 8px;
    width: 32px; height: 32px; cursor: pointer; font-size: 13px; flex: none; }
  .navbtn:hover { background: #333d4a; }
  .navbtn:disabled { opacity: .35; cursor: default; }
  #dots { display: flex; gap: 6px; flex: none; }
  .dot { width: 7px; height: 7px; border-radius: 99px; background: #3c4653; cursor: pointer; }
  .dot.cur { background: #79a8ff; }
  #stext { min-width: 0; }
  #stitle { font-weight: 600; font-size: 13px; color: #e3e9f2; margin-bottom: 2px; }
  #scap { font-size: 12px; color: #98a2b0; line-height: 1.5; max-width: 560px; }
</style>

</div>

<script>
const DATA = {"meta": {"title": "nano-vllm 推理引擎", "subtitle": "github.com/GeeeekExplorer/nano-vllm · ~1200 行的 vLLM 教学重写"}, "regions": [{"id": "A", "title": "故事线 A · 引擎循环", "blurb": "每个 step：调度 → 前向 → 采样 → 写回", "hue": "blue", "cards": ["step", "run", "sampler"]}, {"id": "B", "title": "故事线 B · 调度决策", "blurb": "先喂新客成 prefill 批，收不到才续老客", "hue": "violet", "cards": ["schedule", "preempt", "postprocess"]}, {"id": "C", "title": "故事线 C · 显存账本", "blurb": "KV cache 分块记账，相同前缀按哈希复用", "hue": "green", "cards": ["can_allocate", "allocate", "hash_blocks"]}], "cards": [{"id": "step", "name": "LLMEngine.step()", "file": "engine/llm_engine.py:49", "lang": "py", "layout": {"col": 0, "band": 0}, "collapsed": false, "code": "def step(self):\n    seqs, is_prefill = self.scheduler.schedule()\n    num_tokens = sum(seq.num_scheduled_tokens for seq in seqs) if is_prefill else -len(seqs)\n    token_ids = self.model_runner.call(\"run\", seqs, is_prefill)\n    self.scheduler.postprocess(seqs, token_ids, is_prefill)\n    outputs = [(seq.seq_id, seq.completion_token_ids) for seq in seqs if seq.is_finished]\n    return outputs, num_tokens"}, {"id": "run", "name": "ModelRunner.run()", "file": "engine/model_runner.py:214", "lang": "py", "layout": {"col": 0, "band": 2}, "collapsed": true, "code": "def run(self, seqs: list[Sequence], is_prefill: bool) -> list[int]:\n    input_ids, positions = self.prepare_prefill(seqs) if is_prefill else self.prepare_decode(seqs)\n    temperatures = self.prepare_sample(seqs) if self.rank == 0 else None\n    logits = self.run_model(input_ids, positions, is_prefill)\n    token_ids = self.sampler(logits, temperatures).tolist() if self.rank == 0 else None\n    reset_context()\n    return token_ids"}, {"id": "sampler", "name": "Sampler.forward()", "file": "layers/sampler.py:7", "lang": "py", "layout": {"col": 0, "band": 3}, "collapsed": true, "code": "@torch.compile\ndef forward(self, logits: torch.Tensor, temperatures: torch.Tensor):\n    logits = logits.float().div_(temperatures.unsqueeze(dim=1))\n    probs = torch.softmax(logits, dim=-1)\n    sample_tokens = probs.div_(torch.empty_like(probs).exponential_(1).clamp_min_(1e-10)).argmax(dim=-1)\n    return sample_tokens"}, {"id": "schedule", "name": "Scheduler.schedule()", "file": "engine/scheduler.py:25", "lang": "py", "layout": {"col": 1, "band": 0}, "collapsed": false, "code": "def schedule(self) -> tuple[list[Sequence], bool]:\n    scheduled_seqs = []\n    num_batched_tokens = 0\n\n    # prefill\n    while self.waiting and len(scheduled_seqs) < self.max_num_seqs:\n        seq = self.waiting[0]\n        remaining = self.max_num_batched_tokens - num_batched_tokens\n        if remaining == 0:\n            break\n        if not seq.block_table:\n            num_cached_blocks = self.block_manager.can_allocate(seq)\n            if num_cached_blocks == -1:\n                break\n            num_tokens = seq.num_tokens - num_cached_blocks * self.block_size\n        else:\n            num_tokens = seq.num_tokens - seq.num_cached_tokens\n        if remaining < num_tokens and scheduled_seqs:  # only allow chunked prefill for the first seq\n            break\n        if not seq.block_table:\n            self.block_manager.allocate(seq, num_cached_blocks)\n        seq.num_scheduled_tokens = min(num_tokens, remaining)\n        num_batched_tokens += seq.num_scheduled_tokens\n        if seq.num_cached_tokens + seq.num_scheduled_tokens == seq.num_tokens:\n            seq.status = SequenceStatus.RUNNING\n            self.waiting.popleft()\n            self.running.append(seq)\n        scheduled_seqs.append(seq)\n\n    if scheduled_seqs:\n        return scheduled_seqs, True\n\n    # decode\n    while self.running and len(scheduled_seqs) < self.max_num_seqs:\n        seq = self.running.popleft()\n        while not self.block_manager.can_append(seq):\n            if self.running:\n                self.preempt(self.running.pop())\n            else:\n                self.preempt(seq)\n                break\n        else:\n            seq.num_scheduled_tokens = 1\n            seq.is_prefill = False\n            self.block_manager.may_append(seq)\n            scheduled_seqs.append(seq)\n    assert scheduled_seqs\n    self.running.extendleft(reversed(scheduled_seqs))\n    return scheduled_seqs, False", "blocks": [{"name": "Prefill 批次", "summary": "waiting 队头能塞就塞，直到 token 预算用完", "lines": [5, 31], "children": [{"name": "前缀缓存探测", "summary": "先问账本命中几块，只调度增量部分", "lines": [11, 17]}]}, {"name": "Decode 批次", "summary": "running 逐条续 1 个 token；不够块就抢占", "lines": [33, 46], "children": [{"name": "抢占腾块", "summary": "先牺牲队尾；实在不行牺牲自己", "lines": [36, 41]}]}, {"name": "收尾", "summary": "断言非空 + 恢复队序", "lines": [47, 49]}]}, {"id": "preempt", "name": "Scheduler.preempt()", "file": "engine/scheduler.py:75", "lang": "py", "layout": {"col": 1, "band": 2}, "collapsed": true, "code": "def preempt(self, seq: Sequence):\n    seq.status = SequenceStatus.WAITING\n    seq.is_prefill = True\n    self.block_manager.deallocate(seq)\n    self.waiting.appendleft(seq)"}, {"id": "postprocess", "name": "Scheduler.postprocess()", "file": "engine/scheduler.py:81", "lang": "py", "layout": {"col": 1, "band": 3}, "collapsed": true, "code": "def postprocess(self, seqs: list[Sequence], token_ids: list[int], is_prefill: bool):\n    for seq, token_id in zip(seqs, token_ids):\n        self.block_manager.hash_blocks(seq)\n        seq.num_cached_tokens += seq.num_scheduled_tokens\n        seq.num_scheduled_tokens = 0\n        if is_prefill and seq.num_cached_tokens < seq.num_tokens:\n            continue\n        seq.append_token(token_id)\n        if (not seq.ignore_eos and token_id == self.eos) or seq.num_completion_tokens == seq.max_tokens:\n            seq.status = SequenceStatus.FINISHED\n            self.block_manager.deallocate(seq)\n            self.running.remove(seq)"}, {"id": "can_allocate", "name": "BlockManager.can_allocate()", "file": "engine/block_manager.py:58", "lang": "py", "layout": {"col": 2, "band": 0}, "collapsed": true, "code": "def can_allocate(self, seq: Sequence) -> int:\n    h = -1\n    num_cached_blocks = 0\n    num_new_blocks = seq.num_blocks\n    for i in range(seq.num_blocks - 1):\n        token_ids = seq.block(i)\n        h = self.compute_hash(token_ids, h)\n        block_id = self.hash_to_block_id.get(h, -1)\n        if block_id == -1 or self.blocks[block_id].token_ids != token_ids:\n            break\n        num_cached_blocks += 1\n        if block_id in self.used_block_ids:\n            num_new_blocks -= 1\n    if len(self.free_block_ids) < num_new_blocks:\n        return -1\n    return num_cached_blocks"}, {"id": "allocate", "name": "BlockManager.allocate()", "file": "engine/block_manager.py:75", "lang": "py", "layout": {"col": 2, "band": 2}, "collapsed": true, "code": "def allocate(self, seq: Sequence, num_cached_blocks: int):\n    assert not seq.block_table\n    h = -1\n    for i in range(num_cached_blocks):\n        token_ids = seq.block(i)\n        h = self.compute_hash(token_ids, h)\n        block_id = self.hash_to_block_id[h]\n        block = self.blocks[block_id]\n        if block_id in self.used_block_ids:\n            block.ref_count += 1\n        else:\n            block.ref_count = 1\n            self.free_block_ids.remove(block_id)\n            self.used_block_ids.add(block_id)\n        seq.block_table.append(block_id)\n    for i in range(num_cached_blocks, seq.num_blocks):\n        seq.block_table.append(self._allocate_block())\n    seq.num_cached_tokens = num_cached_blocks * self.block_size", "blocks": [{"name": "认领命中块", "summary": "缓存命中的块挂进 block_table，引用计数 +1", "lines": [4, 15]}, {"name": "增量新块", "summary": "缓存没有的部分拿全新块", "lines": [16, 18]}]}, {"id": "hash_blocks", "name": "BlockManager.hash_blocks()", "file": "engine/block_manager.py:110", "lang": "py", "layout": {"col": 2, "band": 3}, "collapsed": true, "code": "def hash_blocks(self, seq: Sequence):\n    start = seq.num_cached_tokens // self.block_size\n    end = (seq.num_cac     + '|\\b(' + kws.join('|') + ')\\b'                     // keyword
    + '|\\b(\\d+(?:\\.\\d+)?)\\b'                          // number

    const el = document.getElementById('card-' + c.id);
    el.classList.remove('collapsed');

function apply(animate = true) {
  world.classList.toggle('notrans', !animate);
  world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.s})`;
}
function centerOn(wx, wy, s, animate = true) {
  cam.s = s;
  cam.x = innerWidth / 2 - wx * s;
  cam.y = (innerHeight - 70) / 2 - wy * s;
  apply(animate);
}
function fitAll(animate = true) {
  const b = contentBBox();
  const s = Math.min(Math.min(innerWidth / (b.x1 - b.x0 + 60), (innerHeight - 110) / (b.y1 - b.y0 + 60)) * .98, 1.15);
  centerOn((b.x0 + b.x1) / 2, (b.y0 + b.y1) / 2, Math.max(s, .3), animate);
}
function focusOn(ids, animate = true) {
  let x0 = 1e9, y0 = 1e9, x1 = 0, y1 = 0;
  for (const id of ids) {
    const el = document.getElementById('card-' + id) || document.getElementById('note-' + id);
    if (!el) continue;
    const p = wpos(el);
    x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y);
    x1 = Math.max(x1, p.x + p.w); y1 = Math.max(y1, p.y + p.h);
  }
  if (x1 === 0) return fitAll(animate);
  const s = Math.max(.42, Math.min(Math.min(innerWidth / (x1 - x0 + 160), (innerHeight - 170) / (y1 - y0 + 120)), 1.1));
  centerOn((x0 + x1) / 2, (y0 + y1) / 2, s, animate);
}

/* ================= steps ================= */
function setStep(i, animate = true) {
  step = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[step];
  (s.expand || []).forEach(id => {
    const el = document.getElementById('card-' + id);
    el.classList.remove('collapsed');
    el.querySelector('.chev').textContent = '▾';
  });
  (s.unfold || []).forEach(([cid, name]) => {
    const blk = [...document.getElementById('card-' + cid).querySelectorAll('.blk')]
      .find(e => e.querySelector('.bname').textContent === name);
    if (blk) { blk.classList.remove('folded'); blk.querySelector('.bchev').textContent = '▾'; }
  });
  document.querySelectorAll('.ln.hot').forEach(e => e.classList.remove('hot'));
  (s.lines || []).forEach(([cid, ln]) => {
    const e = document.getElementById(cid + '-L' + ln);
    if (e) e.classList.add('hot');
  });
  const activeCards = new Set();
  if (s.wires) for (const w of DATA.wires || []) if (s.wires.includes(w.id)) {
    activeCards.add(w.from.card); activeCards.add(w.to.card);
  }
  document.querySelectorAll('.card').forEach(c =>
    c.classList.toggle('dim', s.wires ? !activeCards.has(c.id.slice(5)) : false));
  document.querySelectorAll('.note').forEach(n => {
    const mine = n.dataset.step !== '' && +n.dataset.step === step;
    n.classList.toggle('hot', mine);
    n.classList.toggle('dim', step > 0 && !mine);
  });
  if (s.fit || !s.focus) fitAll(animate); else focusOn(s.focus, animate);
  drawWires();
  document.getElementById('stitle').textContent = s.title || '';
  document.getElementById('scap').textContent = s.caption || '';
  document.getElementById('prev').disabled = step === 0;
  document.getElementById('next').disabled = step === STEPS.length - 1;
  document.querySelectorAll('.dot').forEach((d, j) => d.classList.toggle('cur', j === step));
}
const dots = document.getElementById('dots');
STEPS.forEach((_, i) => {
  const d = document.createElement('span');
  d.className = 'dot'; d.onclick = () => setStep(i);
  dots.appendChild(d);
});
document.getElementById('prev').onclick = () => setStep(step - 1);
document.getElementById('next').onclick = () => setStep(step + 1);
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') setStep(step - 1);
  if (e.key === 'ArrowRight') setStep(step + 1);
});

/* ================= interactions ================= */
world.addEventListener('click', e => {
  const bar = e.target.closest('.bbar');
  if (bar) {
    const blk = bar.parentElement;
    blk.classList.toggle('folded');
    bar.querySelector('.bchev').textContent = blk.classList.contains('folded') ? '▸' : '▾';
    drawWires(); return;
  }
  const hdr = e.target.closest('.hdr');
  if (hdr) {
    const card = hdr.closest('.card');
    card.classList.toggle('collapsed');
    hdr.querySelector('.chev').textContent = card.classList.contains('collapsed') ? '▸' : '▾';
    drawWires();
  }
});
let drag = null;
vp.addEventListener('pointerdown', e => {
  if (e.target.closest('.hdr') || e.target.closest('.bbar') || e.target.closest('#bar')) return;
  drag = { sx: e.clientX, sy: e.clientY, ox: cam.x, oy: cam.y };
  vp.classList.add('dragging');
  vp.setPointerCapture(e.pointerId);
});
vp.addEventListener('pointermove', e => {
  if (!drag) return;
  cam.x = drag.ox + (e.clientX - drag.sx);
  cam.y = drag.oy + (e.clientY - drag.sy);
  apply(false);
});
vp.addEventListener('pointerup', () => { drag = null; vp.classList.remove('dragging'); });
vp.addEventListener('wheel', e => {
  e.preventDefault();
  const f = Math.exp(-e.deltaY * .0012);
  const ns = Math.min(1.8, Math.max(.3, cam.s * f));
  cam.x = e.clientX - (e.clientX - cam.x) * (ns / cam.s);
  cam.y = e.clientY - (e.clientY - cam.y) * (ns / cam.s);
  cam.s = ns;
  apply(false);
}, { passive: false });
addEventListener('resize', () => { drawWires(); if (STEPS[step].fit) fitAll(false); });

/* ================= init ================= */
const m = location.hash.match(/^#s(\d+)(x?)$/);
requestAnimationFrame(() => {
  layout();
  if (m && m[2]) document.querySelectorAll('.blk, .card').forEach(b => {
    b.classList.remove('folded'); b.classList.remove('collapsed');
    const v = b.querySelector('.bchev, .chev'); if (v) v.textContent = '▾';
  });
  setStep(m ? +m[1] : 0, false);
});
</script>
