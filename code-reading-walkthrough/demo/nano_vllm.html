<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Walkthrough</title>
<style>
  :root {
    --bg:         #f5f5f4;
    --bg-card:    #ffffff;
    --fg:         #1f2328;
    --fg-soft:    #57606a;
    --fg-faint:   #8b949e;
    --border:     #e1e4e8;
    --border-strong: #1f2328;
    --accent:     #5b6cff;
    --accent-soft:#eef0ff;
    --code-bg:    #fbfaf7;
    --shadow-sm:  0 1px 2px rgba(0,0,0,0.04);
    --shadow-md:  0 2px 8px rgba(0,0,0,0.06);
    --shadow-lg:  0 4px 16px rgba(0,0,0,0.08);

    --phase-guard-bg:    #fdf3d6;
    --phase-guard-fg:    #9a7409;
    --phase-setup-bg:    #d6e4f5;
    --phase-setup-fg:    #205493;
    --phase-main-bg:     #ddd3f0;
    --phase-main-fg:     #5b3e9c;
    --phase-handoff-bg:  #d4ead4;
    --phase-handoff-fg:  #2f7a2f;
    --phase-error-bg:    #f5cdc6;
    --phase-error-fg:    #a4332a;
    --phase-cleanup-bg:  #dfe3e6;
    --phase-cleanup-fg:  #4a5560;
    --phase-persist-bg:  #f1d9b3;
    --phase-persist-fg:  #8a5a14;
    --phase-emit-bg:     #c3dfd8;
    --phase-emit-fg:     #2b6b5e;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    color: var(--fg);
    background: var(--bg);
    overflow: hidden;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ------- App shell ------- */
  .app { display: flex; flex-direction: column; height: 100vh; }
  .topbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    z-index: 20;
  }
  .topbar-left { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .topbar-back {
    font-size: 12px;
    color: var(--fg-soft);
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 4px;
  }
  .topbar-back:hover { background: var(--bg); color: var(--fg); }
  .file-badge {
    font-size: 10px;
    letter-spacing: 0.08em;
    font-weight: 600;
    color: var(--fg-faint);
    text-transform: uppercase;
    padding: 2px 6px;
    border: 1px solid var(--border);
    border-radius: 3px;
  }
  .topbar-title {
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 15px;
    font-weight: 600;
    color: var(--fg);
  }
  .topbar-subtitle {
    font-size: 13px;
    color: var(--fg-soft);
  }
  .topbar-subtitle::before { content: '·'; margin: 0 6px; color: var(--fg-faint); }

  .legend {
    display: flex;
    gap: 16px;
    align-items: center;
    font-size: 11px;
    color: var(--fg-soft);
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-swatch {
    width: 14px; height: 14px;
    border-radius: 3px;
    border: 1px solid rgba(0,0,0,0.08);
  }

  .topbar-actions { display: flex; gap: 8px; align-items: center; }
  .icon-btn {
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--fg-soft);
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
  }
  .icon-btn:hover { background: var(--bg); color: var(--fg); }

  /* ------- Main canvas ------- */
  .main {
    flex: 1 1 auto;
    overflow: auto;
    position: relative;
    background: var(--bg);
  }
  .canvas {
    padding: 32px;
    min-height: 100%;
    position: relative;
  }
  .canvas-inner {
    position: relative;
    /* Force the inner to be at least wide enough to hold N cols at their
       minimum width. When the viewport is narrower (or the dock is open and
       eats viewport space), this overflows .main and triggers the horizontal
       scrollbar — keeps cols at a comfortable reading width instead of
       shrinking them to fit. */
    min-width: calc(var(--col-count, 4) * 320px + (var(--col-count, 4) - 1) * 28px);
  }

  /* ------- Cols grid ------- */
  .cols {
    display: grid;
    grid-template-columns: repeat(var(--col-count, 4), minmax(320px, 1fr));
    gap: 28px;
    align-items: start;
    position: relative;
    z-index: 1;
  }
  .col {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .col-header {
    margin-bottom: 4px;
  }
  .step-label {
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--fg-faint);
    font-weight: 600;
  }
  .col-title {
    margin-top: 4px;
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 16px;
    font-weight: 600;
    color: var(--fg);
  }
  .col-title .glyph { color: var(--accent); margin-right: 4px; font-style: italic; }
  .col-description {
    margin-top: 6px;
    font-size: 12.5px;
    color: var(--fg-soft);
    line-height: 1.45;
  }

  /* ------- Block card ------- */
  .block {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: border-color 120ms, box-shadow 120ms;
    position: relative;
  }
  .block:hover {
    border-color: #c9cdd2;
    box-shadow: var(--shadow-md);
  }
  .block.expanded {
    border-color: #b9bfc7;
    box-shadow: var(--shadow-md);
  }
  .block.focused {
    border-color: var(--border-strong);
    border-width: 2px;
    padding: 11px 13px;
    box-shadow: var(--shadow-md);
  }
  .block-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .block-phase {
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 3px;
    background: var(--phase-bg, var(--bg));
    color: var(--phase-fg, var(--fg-soft));
  }
  .block-range {
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    color: var(--fg-faint);
  }
  .block-title {
    margin-top: 8px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--fg);
  }
  .block-one-liner {
    margin-top: 6px;
    font-size: 12.5px;
    color: var(--fg-soft);
    line-height: 1.5;
  }

  /* ------- Block expanded code ------- */
  .block-code {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    line-height: 1.55;
    background: var(--code-bg);
    border-radius: 4px;
    overflow-x: auto;
  }
  .code-line { display: flex; gap: 12px; padding: 0 8px; }
  .code-line .ln {
    color: var(--fg-faint);
    user-select: none;
    text-align: right;
    min-width: 30px;
    flex-shrink: 0;
  }
  .code-line .src { white-space: pre; }
  .code-line.context .ln, .code-line.context .src { opacity: 0.45; }

  /* Syntax highlighting tokens (TS/JS/Python). Muted palette to keep
     legibility with the reading-mode beige page background. */
  .tok-kw     { color: #5b3e9c; font-weight: 600; }
  .tok-type   { color: #205493; }
  .tok-str    { color: #8a5a14; }
  .tok-num    { color: #2b6b5e; }
  .tok-com    { color: #8b949e; font-style: italic; }
  .tok-fn     { color: #2f7a2f; }
  .tok-builtin{ color: #a4332a; }
  .tok-op     { color: #57606a; }
  .tok-punct  { color: #57606a; }

  /* ------- Reading overview ------- */
  .overview {
    max-width: 920px;
    margin: 0 auto;
    padding: 32px 0;
  }
  .overview h1 {
    font-size: 24px;
    font-weight: 700;
    margin: 0 0 4px;
  }
  .overview .pitch {
    font-size: 15px;
    color: var(--fg-soft);
    margin-bottom: 24px;
  }
  .scope-panel {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 20px;
    margin-bottom: 28px;
  }
  .scope-panel h3 {
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fg-faint);
    margin: 0 0 10px;
    font-weight: 600;
  }
  .scope-item { display: flex; gap: 10px; padding: 4px 0; font-size: 13px; }
  .scope-item .reason {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--fg-soft);
    background: var(--bg);
    padding: 1px 6px;
    border-radius: 3px;
    align-self: center;
  }
  .scope-item .path {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    color: var(--fg);
  }
  .scope-item .note { color: var(--fg-soft); flex: 1; }
  .scope-criteria {
    margin-top: 12px;
    font-size: 12.5px;
    color: var(--fg-soft);
    font-style: italic;
  }

  .storyline-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 20px;
    margin-bottom: 14px;
    cursor: pointer;
    transition: border-color 120ms, box-shadow 120ms;
  }
  .storyline-card:hover {
    border-color: #c9cdd2;
    box-shadow: var(--shadow-md);
  }
  .storyline-card.summary { background: var(--bg); cursor: default; }
  .sc-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }
  .sc-title { font-size: 16px; font-weight: 600; margin: 0; }
  .sc-badges { display: flex; gap: 6px; flex-shrink: 0; }
  .sc-badge {
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--fg-soft);
    background: var(--bg);
    padding: 2px 6px;
    border-radius: 3px;
  }
  .sc-badge.score { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .sc-anchor {
    margin-top: 8px;
    font-size: 13px;
    color: var(--fg-soft);
    line-height: 1.5;
  }
  .sc-files {
    margin-top: 10px;
    font-size: 11.5px;
    color: var(--fg-faint);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
  }
  .promote-btn {
    margin-top: 12px;
    font-size: 11px;
    padding: 4px 10px;
    border: 1px dashed var(--border);
    border-radius: 4px;
    background: transparent;
    color: var(--fg-soft);
    cursor: pointer;
  }
  .promote-btn:not(:disabled):hover { background: var(--bg-card); color: var(--fg); border-style: solid; }
  .promote-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .storyline-card.pending { opacity: 0.85; pointer-events: none; }
  .promote-pending {
    margin-top: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--fg-soft);
  }
  .promote-pending-note { color: var(--fg-faint); font-size: 11px; }
  .promote-spinner {
    width: 12px; height: 12px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  .promote-error {
    margin-top: 12px;
    font-size: 12px;
    padding: 8px 10px;
    border: 1px solid #e3b0aa;
    background: #fdf2f0;
    border-radius: 4px;
    color: #6b2018;
  }
  .promote-error-retry {
    margin-left: 8px;
    font-size: 11px;
    padding: 2px 8px;
    border: 1px solid #c54343;
    background: white;
    color: #c54343;
    border-radius: 3px;
    cursor: pointer;
  }
  .promote-error-retry:hover { background: #c54343; color: white; }

  .sc-badge.promoted {
    background: #e8f4e8;
    color: #2f7a2f;
    border: 1px solid #c7ddc7;
  }
  .storyline-card.promoted { border-left: 3px solid #2f7a2f; }
  .revert-btn {
    margin-top: 12px;
    margin-left: 8px;
    font-size: 11px;
    padding: 3px 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--fg-soft);
    border-radius: 3px;
    cursor: pointer;
  }
  .revert-btn:hover { background: var(--bg); color: var(--fg); border-color: var(--fg-soft); }

  /* ------- Edges SVG overlay ------- */
  .edges-svg {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    overflow: visible;
  }
  .edge-path { fill: none; stroke-width: 1.5; }
  .edge-path.dashed { stroke-dasharray: 5 4; }
  .edge-label {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    fill: var(--edge-color, var(--fg-soft));
  }
  .edge-label-bg {
    fill: var(--bg);
    stroke: none;
  }

  /* ------- Right dock ------- */
  .dock {
    position: fixed;
    top: var(--topbar-h, 56px);
    right: 0;
    bottom: 0;
    width: 400px;
    background: var(--bg-card);
    border-left: 1px solid var(--border);
    padding: 24px 24px 80px;
    overflow-y: auto;
    box-shadow: -2px 0 12px rgba(0,0,0,0.05);
    transform: translateX(100%);
    transition: transform 180ms ease;
    z-index: 10;
  }
  .dock.open { transform: translateX(0); }
  /* When dock is open, extend canvas's scrollable area by the dock's width so the
     rightmost columns can be scrolled into view from behind the fixed dock. */
  .main.dock-open .canvas { padding-right: 432px; }
  .dock-breadcrumb {
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fg-faint);
    margin-bottom: 4px;
  }
  .dock-breadcrumb .sep { margin: 0 6px; color: var(--border); }
  .dock-close {
    position: absolute;
    top: 16px;
    right: 16px;
    background: none;
    border: none;
    font-size: 18px;
    color: var(--fg-faint);
    cursor: pointer;
    padding: 4px 8px;
    line-height: 1;
  }
  .dock-close:hover { color: var(--fg); }
  .dock-title {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin: 8px 0 4px;
  }
  .dock-subtitle {
    font-size: 12px;
    color: var(--fg-soft);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    margin-bottom: 18px;
  }
  .dock-section { margin-bottom: 20px; }
  .dock-section h4 {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--fg-faint);
    margin: 0 0 8px;
    font-weight: 600;
  }
  .dock-section p { margin: 0 0 8px; font-size: 13px; line-height: 1.55; }
  .dock-section ul { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.55; }
  .dock-section ul li { margin-bottom: 4px; }

  .touch-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .touch-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 11.5px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    color: var(--fg);
    background: var(--bg);
  }
  .touch-chip.linked { cursor: pointer; }
  .touch-chip.linked:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

  .kds-item { margin-bottom: 10px; }
  .kds-item .name {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 12px;
    font-weight: 600;
  }
  .kds-item .shape, .kds-item .role { font-size: 12.5px; color: var(--fg-soft); }

  .prereq-item { margin-bottom: 8px; font-size: 12.5px; }
  .prereq-item .kind {
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--fg-faint);
    margin-right: 6px;
  }
  .prereq-item.linked { cursor: pointer; }
  .prereq-item.linked:hover { color: var(--accent); }

  /* ------- Q&A (live mode) ------- */
  .qa-section { margin-top: 12px; }
  .qa-input-row {
    display: flex;
    gap: 6px;
    margin-top: 8px;
  }
  .qa-input {
    flex: 1;
    font-size: 13px;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-family: inherit;
    resize: vertical;
    min-height: 32px;
    max-height: 120px;
  }
  .qa-input:focus { border-color: var(--accent); outline: none; }
  .qa-submit {
    padding: 0 12px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: white;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
  }
  .qa-submit:disabled { opacity: 0.5; cursor: not-allowed; }
  .qa-cancel {
    padding: 0 8px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--fg-soft);
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
  }
  .qa-item {
    margin-bottom: 10px;
    padding: 8px 10px;
    background: var(--bg);
    border-radius: 4px;
    font-size: 12.5px;
  }
  .qa-q {
    font-weight: 600;
    color: var(--fg);
    margin-bottom: 4px;
  }
  .qa-a { color: var(--fg-soft); line-height: 1.5; }
  .qa-a p { margin: 0 0 6px; }
  .qa-a pre {
    background: var(--code-bg);
    border-radius: 3px;
    padding: 6px 8px;
    overflow-x: auto;
    font-size: 11.5px;
  }
  .qa-a code { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .qa-meta {
    margin-top: 4px;
    font-size: 10px;
    color: var(--fg-faint);
  }
  .qa-pending {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--fg-soft);
    font-size: 12px;
  }
  .qa-spinner {
    width: 12px; height: 12px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .live-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--fg-soft);
    padding: 2px 6px;
    border: 1px solid var(--border);
    border-radius: 3px;
  }
  .live-badge.live { color: #2f7a2f; border-color: #c7ddc7; background: #f0f8f0; }
  .live-badge.live::before {
    content: '';
    width: 6px; height: 6px;
    background: #2f7a2f;
    border-radius: 50%;
  }

  /* ------- Empty / error states ------- */
  .empty-state {
    padding: 60px 40px;
    text-align: center;
    color: var(--fg-soft);
  }

</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar" id="topbar"></header>
  <main class="main" id="main">
    <div class="canvas" id="canvas"></div>
    <aside class="dock" id="dock"></aside>
  </main>
</div>

<script>
  const WALKTHROUGH_DATA = {
  "schema_version": "0.5-reading",
  "metadata": {
    "repo": "github.com/GeeeekExplorer/nano-vllm",
    "commit": "main",
    "target": "How does nano-vllm admit a new request and schedule its prefill?",
    "title": "Inside nano-vllm — request lifecycle & prefill scheduling",
    "generated_at": "2026-06-29T00:00:00Z"
  },
  "summary": {
    "one_line": "A request enters via LLMEngine.add_request, sits in scheduler.waiting until schedule() admits it (probing the prefix cache and allocating KV blocks), then the model_runner forwards it and postprocess hashes the filled blocks for cross-request reuse.",
    "description": "nano-vllm is a ~1200-line readable reimplementation of vLLM's core inference loop. This walkthrough traces a single request from arrival to its first decode-able state. It deliberately stops before decode + teardown (summarized in S3) — the prefill path is where PagedAttention's chained-hash prefix cache and chunked-prefill carve actually pay off."
  },
  "scope": {
    "mode": "topic",
    "input": "How does nano-vllm admit a new request and schedule its prefill?",
    "discovered_scope": [
      {
        "path": "nanovllm/engine/llm_engine.py",
        "reason": "entry-point",
        "note": "Public LLM class + generate() pump."
      },
      {
        "path": "nanovllm/engine/scheduler.py",
        "reason": "core-flow",
        "note": "Prefill loop, chunked-prefill rule, promote-to-running."
      },
      {

  // -------- State --------
  const state = {
    view: 'overview',
    storylineId: null,
    expandedBlockIds: [],    // independent toggle per block, click order
    focusedBlockId: null,    // which block's content fills the dock

    liveMode: false,
    serverInfo: null,
    followups: {},
    pendingAsk: null,

    // Promotions: summary-depth storylines that the server promoted to full.
    // Keyed by storyline_id; the value is a full-depth storyline object that
    // overrides WALKTHROUGH_DATA.storylines via getStoryline().
    promotions: {},
    pendingPromotions: new Set(),
    promotionErrors: {},     // storyline_id → last error message
  };

  const STORAGE_PREFIX = 'walkthrough.v0.5.' +
    (WALKTHROUGH_DATA?.metadata?.commit ?? 'nocommit') + '.' +
    (WALKTHROUGH_DATA?.metadata?.target ?? 'notarget') + '.';

  function saveState() {
    try {
      localStorage.setItem(STORAGE_PREFIX + 'view', JSON.stringify({
        view: state.view,
        storylineId: state.storylineId,
        expandedBlockIds: state.expandedBlockIds,
        focusedBlockId: state.focusedBlockId,
      }));
    } catch (e) {}
  }
  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_PREFIX + 'view');
      if (!raw) return;
      const v = JSON.parse(raw);
      Object.assign(state, v);
      if (!Array.isArray(state.expandedBlockIds)) state.expandedBlockIds = [];
    } catch (e) {}
  }

  // -------- Lookup helpers --------
  function getStoryline(id) {
    // Promoted version wins so all downstream code (cards, diagram view,
    // findBlock, etc.) sees the full-depth storyline transparently.
    if (state.promotions && state.promotions[id]) return state.promotions[id];
    return (WALKTHROUGH_DATA?.storylines ?? []).find(s => s.id === id);
  }
  function findBlock(storyline, blockId) {
    if (!storyline?.diagram) return null;
    for (const col of storyline.diagram.cols ?? []) {
      for (const block of col.blocks ?? []) {
        if (block.id === blockId) return { block, col };
      }
    }
    return null;
  }
  function getPhaseDef(storyline, phaseId) {
    return (storyline?.diagram?.phases ?? []).find(p => p.id === phaseId);
  }
  function phaseColorVars(phaseTokenOrColor) {
    const namedTokens = ['guard','setup','main','handoff','cleanup','error','persist','emit'];
    if (!phaseTokenOrColor) return { bg: 'var(--bg)', fg: 'var(--fg-soft)' };
    if (namedTokens.includes(phaseTokenOrColor)) {
      return {
        bg: `var(--phase-${phaseTokenOrColor}-bg)`,
        fg: `var(--phase-${phaseTokenOrColor}-fg)`,
      };
    }
    return { bg: phaseTokenOrColor, fg: 'var(--fg)' };
  }

  // -------- Rendering: overview --------
  function renderOverview() {
    const canvas = document.getElementById('canvas');
    const data = WALKTHROUGH_DATA;
    if (!data) {
      canvas.innerHTML = '<div class="empty-state">No walkthrough data loaded.</div>';
      return;
    }
    const storylines = data.storylines ?? [];
    // Resolve each storyline through getStoryline so promoted versions
    // render with their full-depth content + Promoted badge.
    const resolved = storylines.map(s => getStoryline(s.id) ?? s);
    canvas.innerHTML = `
      <div class="overview">
        <h1>${escapeHtml(data.metadata?.title ?? 'Walkthrough')}</h1>
        <div class="pitch">${escapeHtml(data.summary?.one_line ?? '')}</div>

        ${resolved.map(renderStorylineCard).join('')}
      </div>
    `;
    // Wire card-level navigation for any storyline that's now full-depth
    // (originally full OR promoted). Also wire promote/revert buttons.
    resolved.forEach(s => {
      const el = document.querySelector(`[data-storyline-id="${cssEscape(s.id)}"]`);
      if (!el) return;
      const isFull = (s.depth ?? 'full') === 'full' || !!s.promoted;
      if (isFull) {
        el.onclick = (e) => {
          // Don't navigate when clicking the revert/retry buttons.
          if (e.target.closest('.revert-btn, .promote-btn, .promote-error-retry')) return;
          goToStoryline(s.id);
        };
      }
      const promoteBtn = el.querySelector('.promote-btn');
      if (promoteBtn && !promoteBtn.disabled) {
        promoteBtn.onclick = (e) => { e.stopPropagation(); promoteStoryline(s.id); };
      }
      const retryBtn = el.querySelector('.promote-error-retry');
      if (retryBtn) {
        retryBtn.onclick = (e) => { e.stopPropagation(); promoteStoryline(s.id); };
      }
      const revertBtn = el.querySelector('.revert-btn');
      if (revertBtn) {
        revertBtn.onclick = (e) => { e.stopPropagation(); revertPromotion(s.id); };
      }
    });
  }

  // -------- Rendering: storyline (flow inspector) --------
  function renderStoryline() {
    const canvas = document.getElementById('canvas');
    const storyline = getStoryline(state.storylineId);
    if (!storyline || !storyline.diagram) {
      canvas.innerHTML = '<div class="empty-state">Storyline not found or has no diagram.</div>';

    }

        </div>
        <svg class="edges-svg" id="edges-svg"></svg>

    `;
    bindBlockClicks();
    renderEdges(storyline);
  }

  function renderCol(col, idx, storyline) {
    return `
      <div class="col" data-col-id="${escapeAttr(col.id)}">
        <div class="col-header">
          <div class="step-label">STEP ${idx + 1}</div>
          <div class="col-title"><span class="glyph">ƒ</span>${escapeHtml(col.label || col.function || col.id)}</div>
          ${col.description ? `<div class="col-description">${escapeHtml(col.description)}</div>` : ''}
        </div>
        ${(col.blocks ?? []).map(b => renderBlock(b, storyline)).join('')}
      </div>
    `;
  }

  function renderBlock(block, storyline) {
    const phaseDef = getPhaseDef(storyline, block.phase);
    const { bg, fg } = phaseColorVars(phaseDef?.color ?? block.phase);
    const isExpanded = state.expandedBlockIds.includes(block.id);
    const isFocused = state.focusedBlockId === block.id;
    const cls = ['block'];
    if (isFocused) cls.push('focused');
    if (isExpanded) cls.push('expanded');
    return `
      <div class="${cls.join(' ')}" data-block-id="${escapeAttr(block.id)}"
           data-phase="${escapeAttr(block.phase)}"
           style="--phase-bg:${bg};--phase-fg:${fg};">
        <div class="block-head">
          <span class="block-phase">${escapeHtml(phaseDef?.label || block.phase || '')}</span>
          <span class="block-range">${escapeHtml(block.line_range || '')}</span>
        </div>
        <div class="block-title">${escapeHtml(block.title || '')}</div>
        <div class="block-one-liner">${escapeHtml(block.one_liner || '')}</div>
        ${isExpanded ? renderBlockCode(block) : ''}
      </div>
    `;
  }

  function renderBlockCode(block) {
    const cv = block.code_view;
    if (!cv || !cv.lines?.length) return '';
    const rangeLines = parseLineRange(block.line_range);
    const lang = (cv.language || '').toLowerCase();
    // Highlight per-language across the full block as one string so multi-line
    // tokens like /* ... */ and triple-quoted strings work. Then split back
    // into <div class="code-line"> rows.
    const joined = cv.lines.map(l => l.content ?? '').join('\n');
    const highlighted = highlightCode(joined, lang); // array of arrays-of-html (one per line)
    const html = cv.lines.map((l, i) => {
      const inRange = rangeLines && l.line_num >= rangeLines[0] && l.line_num <= rangeLines[1];
      const srcHtml = highlighted[i] ?? escapeHtml(l.content ?? '');
      return `<div class="code-line${inRange ? '' : ' context'}"><span class="ln">${l.line_num}</span><span class="src">${srcHtml}</span></div>`;
    }).join('');
    return `<div class="block-code">${html}</div>`;
  }

  // -------- Syntax highlighter (TS/JS/Python) --------
  // Single-pass tokenizer that handles line + block comments, string literals
  // (single/double/backtick + Python triple-quoted), numbers, keywords,
  // builtin types, and function-call identifiers. Returns one HTML-escaped
  // line per source line. Unrecognized languages return escaped plain text.
  const HL_LANGS = {
    ts: {
      keywords: new Set(['abstract','as','async','await','break','case','catch','class','const','continue','default','delete','do','else','enum','export','extends','finally','for','from','function','get','if','implements','import','in','instanceof','interface','is','keyof','let','namespace','new','of','private','protected','public','readonly','return','satisfies','set','static','super','switch','this','throw','try','type','typeof','var','void','while','with','yield']),
      types: new Set(['string','number','boolean','any','unknown','never','void','undefined','null','object','Array','Promise','Set','Map','Record','Partial','Omit','Pick','Readonly','ReadonlySet','ReadonlyMap','AbortController','AbortSignal','Error']),
      builtins: new Set(['true','false','null','undefined','console','globalThis','window','document','process','Math','JSON','Object','Date']),
      lineComment: '//',
      blockComment: ['/*', '*/'],
      strings: ['"', "'", '`'],
    },
    js: null,   // alias resolved below
    tsx: null,
    jsx: null,
    typescript: null,
    javascript: null,
    py: {
      keywords: new Set(['and','as','assert','async','await','break','class','continue','def','del','elif','else','except','finally','for','from','global','if','import','in','is','lambda','nonlocal','not','or','pass','raise','return','try','while','with','yield']),
      types: new Set(['int','float','str','bool','bytes','list','dict','tuple','set','frozenset','None','True','False']),
      builtins: new Set(['print','len','range','open','enumerate','zip','map','filter','sorted','reversed','sum','min','max','abs','any','all','isinstance','type','self','cls']),
      lineComment: '#',
      blockComment: null,
      strings: ['"""', "'''", '"', "'"],
    },
    python: null,
  };
  // Resolve language aliases.
  HL_LANGS.js = HL_LANGS.tsx = HL_LANGS.jsx = HL_LANGS.typescript = HL_LANGS.javascript = HL_LANGS.ts;
  HL_LANGS.python = HL_LANGS.py;

  function highlightCode(source, lang) {
    const cfg = HL_LANGS[lang];
    if (!cfg) {
      // Unknown language → just escape and split by line.
      return source.split('\n').map(escapeHtml);
    }
    const parts = []; // [{type, text}]
    let i = 0;
    const n = source.length;
    const isIdStart = (c) => /[A-Za-z_$]/.test(c);
    const isIdCont  = (c) => /[A-Za-z0-9_$]/.test(c);

    while (i < n) {
      const ch = source[i];

      // Line comment
      if (cfg.lineComment && source.startsWith(cfg.lineComment, i)) {
        const j = source.indexOf('\n', i);
        const end = j < 0 ? n : j;
        parts.push({ type: 'com', text: source.slice(i, end) });
        i = end;
        continue;
      }
      // Block comment
      if (cfg.blockComment && source.startsWith(cfg.blockComment[0], i)) {
        const close = cfg.blockComment[1];
        const j = source.indexOf(close, i + cfg.blockComment[0].length);
        const end = j < 0 ? n : j + close.length;
        parts.push({ type: 'com', text: source.slice(i, end) });
        i = end;
        continue;
      }
      // String literal — try the strings list, longest delimiter first.
      let matchedString = false;
      for (const q of cfg.strings) {
        if (source.startsWith(q, i)) {
          let j = i + q.length;
          while (j < n) {
            if (source[j] === '\\' && q.length === 1) { j += 2; continue; }
            if (source.startsWith(q, j)) { j += q.length; break; }
            j++;
          }
          parts.push({ type: 'str', text: source.slice(i, j) });
          i = j;
          matchedString = true;
          break;
        }
      }
      if (matchedString) continue;

      // Number
      if (/[0-9]/.test(ch)) {
        let j = i;
        while (j < n && /[0-9._xXa-fA-F]/.test(source[j])) j++;
        parts.push({ type: 'num', text: source.slice(i, j) });
        i = j;
        continue;
      }

      // Identifier / keyword / type / builtin / function call
      if (isIdStart(ch)) {
        let j = i;
        while (j < n && isIdCont(source[j])) j++;
        const word = source.slice(i, j);
        let cls = null;
        if (cfg.keywords.has(word)) cls = 'kw';
        else if (cfg.types.has(word)) cls = 'type';
        else if (cfg.builtins.has(word)) cls = 'builtin';
        else {
          // function call: identifier immediately followed by `(`
          let k = j;
          while (k < n && source[k] === ' ') k++;
          if (source[k] === '(') cls = 'fn';
        }
        parts.push({ type: cls, text: word });
        i = j;
        continue;
      }

      // Operator / punct (cheap heuristic — single char)
      if (/[+\-*/%=<>!&|^~?:]/.test(ch)) {
        parts.push({ type: 'op', text: ch });
        i++;
        continue;
      }
      if (/[(){}\[\];,.]/.test(ch)) {
        parts.push({ type: 'punct', text: ch });
        i++;
        continue;
      }

      // Whitespace / unknown — passthrough
      parts.push({ type: null, text: ch });
      i++;
    }

    // Re-assemble as HTML, splitting on newlines into one entry per line.
    const lines = [['']];
    for (const p of parts) {
      const html = p.type
        ? `<span class="tok-${p.type}">${escapeHtml(p.text)}</span>`
        : escapeHtml(p.text);
      // We need to break on raw '\n' in the text, not in the html.
      const segments = p.text.split('\n');
      if (segments.length === 1) {
        lines[lines.length - 1][0] += html;
      } else {
        for (let s = 0; s < segments.length; s++) {
          const seg = segments[s];
          const segHtml = p.type
            ? `<span class="tok-${p.type}">${escapeHtml(seg)}</span>`
            : escapeHtml(seg);
          lines[lines.length - 1][0] += segHtml;
          if (s < segments.length - 1) lines.push(['']);
        }
      }
    }
    return lines.map(l => l[0]);
  }

  function parseLineRange(range) {
    if (!range) return null;
    const m = String(range).match(/L?(\d+)(?:[–—-](\d+))?/);
    if (!m) return null;
    const lo = parseInt(m[1], 10);
    const hi = m[2] ? parseInt(m[2], 10) : lo;
    return [lo, hi];
  }

  function bindBlockClicks() {
    document.querySelectorAll('#canvas .block').forEach(el => {
      el.onclick = (e) => {
        e.stopPropagation();
        toggleBlock(el.dataset.blockId);
      };
    });
  }

  // -------- Block toggle --------
  // Click toggles a block's expansion independently. Focus (= dock content)
  // follows the most recent expand. If the focused block is collapsed, focus
  // walks back to whatever was expanded just before; if nothing's expanded,
  // the dock closes.
  function toggleBlock(id) {
    const idx = state.expandedBlockIds.indexOf(id);
    if (idx >= 0) {
      state.expandedBlockIds.splice(idx, 1);
      if (state.focusedBlockId === id) {
        state.focusedBlockId = state.expandedBlockIds.length
          ? state.expandedBlockIds[state.expandedBlockIds.length - 1]
          : null;
      }
    } else {
      state.expandedBlockIds.push(id);
      state.focusedBlockId = id;
    }
    saveState();
    renderStoryline();
    renderDock();
    requestAnimationFrame(() => renderEdges(getStoryline(state.storylineId)));
  }

  function focusBlock(id, { expand = true } = {}) {
    if (expand && !state.expandedBlockIds.includes(id)) {
      state.expandedBlockIds.push(id);
    }
    state.focusedBlockId = id;
    saveState();
    renderStoryline();
    renderDock();
    requestAnimationFrame(() => renderEdges(getStoryline(state.storylineId)));
  }

  function closeDock() {
    state.focusedBlockId = null;
    saveState();
    renderDock();
  }

  function collapseAll() {
    state.expandedBlockIds = [];
    state.focusedBlockId = null;
    saveState();
    renderStoryline();
    renderDock();
    requestAnimationFrame(() => renderEdges(getStoryline(state.storylineId)));
  }

  // -------- Edges --------
  function renderEdges(storyline) {
    const svg = document.getElementById('edges-svg');
    if (!svg || !storyline?.diagram) return;
    const edges = storyline.diagram.edges ?? [];
    const inner = document.querySelector('.canvas-inner');
    if (!inner) return;
    const innerRect = inner.getBoundingClientRect();
    svg.setAttribute('width', innerRect.width);
    svg.setAttribute('height', innerRect.height);
    svg.setAttribute('viewBox', `0 0 ${innerRect.width} ${innerRect.height}`);
    const parts = [];
    for (const e of edges) {
      const fromEl = document.querySelector(`#canvas [data-block-id="${cssEscape(e.from)}"]`);
      const toEl   = document.querySelector(`#canvas [data-block-id="${cssEscape(e.to)}"]`);
      if (!fromEl || !toEl) continue;
      const route = computeEdgeRoute(fromEl, toEl, innerRect);
      if (!route) continue;
      const color = e.color || '#777';
      const cls = `edge-path${e.style === 'dashed' ? ' dashed' : ''}`;
      parts.push(`<path class="${cls}" d="${route.d}" stroke="${color}" />`);
      if (e.label) {
        const labelW = e.label.length * 6 + 12;
        parts.push(`<rect class="edge-label-bg" x="${route.labelX - labelW/2}" y="${route.labelY - 8}" width="${labelW}" height="14" rx="2"/>`);
        parts.push(`<text class="edge-label" x="${route.labelX}" y="${route.labelY + 3}" text-anchor="middle" style="--edge-color:${color}">${escapeHtml(e.label)}</text>`);
      }
    }
    svg.innerHTML = parts.join('');
  }

  // Pick edge endpoints + control points based on the relative position of
  // source/target blocks. Three cases:
  //  - forward inter-column (from.right < to.left): horizontal bezier exiting
  //    right side of source, entering left side of target.
  //  - same-column downward: vertical bezier from source bottom to target top,
  //    staying inside the column.
  //  - same-column upward (loop-back) OR backward inter-column: exit LEFT side
  //    of source, sweep through the col-left gap, enter LEFT side of target.
  function computeEdgeRoute(fromEl, toEl, innerRect) {
    const fr = fromEl.getBoundingClientRect();
    const tr = toEl.getBoundingClientRect();
    const FL = fr.left  - innerRect.left;
    const FR = fr.right - innerRect.left;
    const FT = fr.top   - innerRect.top;
    const FB = fr.bottom - innerRect.top;
    const TL = tr.left  - innerRect.left;
    const TR = tr.right - innerRect.left;
    const TT = tr.top   - innerRect.top;
    const TB = tr.bottom - innerRect.top;

    const fromCX = (FL + FR) / 2;
    const toCX   = (TL + TR) / 2;
    const fromCY = (FT + FB) / 2;
    const toCY   = (TT + TB) / 2;
    // Same column when horizontal centers are within 40% of source width
    // (catches typical grid cols where blocks share a left/right edge).
    const sameCol = Math.abs(fromCX - toCX) < (FR - FL) * 0.4;

    if (sameCol && TT > FB) {
      // Same column, downward → vertical bezier
      const startX = fromCX;
      const startY = FB;
      const endX   = toCX;
      const endY   = TT;
      const sweep  = Math.max(12, (endY - startY) * 0.3);
      return {
        d: `M ${startX} ${startY} C ${startX} ${startY + sweep}, ${endX} ${endY - sweep}, ${endX} ${endY}`,
        labelX: (startX + endX) / 2,
        labelY: (startY + endY) / 2,
      };
    }

    if (TL > FR) {
      // Forward inter-column → horizontal bezier right→left
      const startX = FR;
      const startY = fromCY;
      const endX   = TL;
      const endY   = toCY;
      const sweep  = Math.max(40, (endX - startX) * 0.4);
      return {
        d: `M ${startX} ${startY} C ${startX + sweep} ${startY}, ${endX - sweep} ${endY}, ${endX} ${endY}`,
        labelX: (startX + endX) / 2,
        labelY: (startY + endY) / 2,
      };
    }

    // Same-column upward (loop-back) OR backward inter-column → route LEFT
    // through the gap to the left of the source column. The detour is small
    // (just enough to clear the source/target blocks) so the edge sits in
    // the inter-column whitespace rather than slashing across other content.
    const startX = FL;
    const startY = fromCY;
    const endX   = TL;
    const endY   = toCY;
    const detour = sameCol ? 22 : Math.max(40, (FL - TL) * 0.4);
    const c1x    = startX - detour;
    const c2x    = endX   - detour;
    return {
      d: `M ${startX} ${startY} C ${c1x} ${startY}, ${c2x} ${endY}, ${endX} ${endY}`,
      labelX: Math.min(c1x, c2x) + 4,
      labelY: (startY + endY) / 2,
    };
  }

  function cssEscape(s) {
    return String(s).replace(/[^a-zA-Z0-9_\-]/g, c => `\\${c}`);
  }

  // -------- Dock --------
  function renderDock() {
    const dock = document.getElementById('dock');
    const main = document.getElementById('main');
    if (!state.focusedBlockId) {
      dock.classList.remove('open');
      main?.classList.remove('dock-open');
      dock.innerHTML = '';
      return;
    }
    const storyline = getStoryline(state.storylineId);
    const hit = findBlock(storyline, state.focusedBlockId);
    if (!hit) { dock.classList.remove('open'); main?.classList.remove('dock-open'); dock.innerHTML = ''; return; }
    const { block, col } = hit;
    const phaseDef = getPhaseDef(storyline, block.phase);
    const rp = block.right_panel ?? {};
    const lineCount = countLines(block.line_range);

    dock.innerHTML = `
      <button class="dock-close" id="dock-close">×</button>
      <div class="dock-breadcrumb">${escapeHtml(col.label || col.function || col.id)}<span class="sep">·</span>${escapeHtml(phaseDef?.label || block.phase || '')}</div>
      <div class="dock-title">${escapeHtml(block.title || '')}</div>
      <div class="dock-subtitle">${escapeHtml(block.line_range || '')}${lineCount ? ` · ${lineCount} line${lineCount === 1 ? '' : 's'}` : ''}</div>

      ${rp.what_it_does ? `<div class="dock-section"><h4>What it does</h4><p>${escapeHtml(rp.what_it_does)}</p></div>` : ''}
      ${rp.why_its_here ? `<div class="dock-section"><h4>Why it's here</h4><p>${escapeHtml(rp.why_its_here)}</p></div>` : ''}
      ${renderTouches(rp.touches)}
      ${renderFailureMode(rp.failure_mode)}
      ${renderInvariants(rp.invariants)}
      ${renderKDS(rp.key_data_structures)}
      ${renderPrereqs(rp.prerequisites)}
      ${renderQASection(block, storyline, col)}
    `;
    dock.classList.add('open');
    main?.classList.add('dock-open');
    requestAnimationFrame(() => renderEdges(getStoryline(state.storylineId)));
    document.getElementById('dock-close').onclick = () => closeDock();
    bindTouchClicks();
    bindPrereqClicks();
    bindQAControls(block, storyline, col);
  }

  function renderTouches(touches) {
    if (!touches?.length) return '';
    return `
      <div class="dock-section">
        <h4>Touches</h4>
        <div class="touch-chips">
          ${touches.map(t => `<span class="touch-chip${t.block ? ' linked' : ''}" data-touch-block="${escapeAttr(t.block || '')}">${escapeHtml(t.label)}</span>`).join('')}
        </div>
      </div>
    `;
  }
  function renderFailureMode(items) {
    if (!items?.length) return '';
    return `
      <div class="dock-section">
        <h4>Failure mode</h4>
        <ul>${items.map(i => `<li>${escapeHtml(i)}</li>`).join('')}</ul>
      </div>
    `;
  }
  function renderInvariants(items) {
    if (!items?.length) return '';
    return `
      <div class="dock-section">
        <h4>Invariants</h4>
        <ul>${items.map(i => `<li>${escapeHtml(i)}</li>`).join('')}</ul>
      </div>
    `;
  }
  function renderKDS(items) {
    if (!items?.length) return '';
    return `
      <div class="dock-section">
        <h4>Key data structures</h4>
        ${items.map(k => `
          <div class="kds-item">
            <span class="name">${escapeHtml(k.name)}</span> — <span class="shape">${escapeHtml(k.shape)}</span>
            <div class="role">${escapeHtml(k.role)}</div>
          </div>
        `).join('')}
      </div>
    `;
  }
  function renderPrereqs(items) {
    if (!items?.length) return '';
    return `
      <div class="dock-section">
        <h4>Prerequisites</h4>
        ${items.map(p => `<div class="prereq-item${p.kind === 'prior_block' ? ' linked' : ''}" data-prereq-block="${escapeAttr(p.kind === 'prior_block' ? p.reference_id : '')}"><span class="kind">${escapeHtml(p.kind)}</span>${escapeHtml(p.summary)}</div>`).join('')}
      </div>
    `;
  }
  function bindTouchClicks() {
    document.querySelectorAll('.touch-chip.linked').forEach(el => {
      el.onclick = () => {
        const id = el.dataset.touchBlock;
        if (!id) return;
        focusBlock(id);
        scrollBlockIntoView(id);
      };
    });
  }
  function bindPrereqClicks() {
    document.querySelectorAll('.prereq-item.linked').forEach(el => {
      el.onclick = () => {
        const id = el.dataset.prereqBlock;
        if (!id) return;
        focusBlock(id);
        scrollBlockIntoView(id);
      };
    });
  }
  function scrollBlockIntoView(id) {
    const el = document.querySelector(`#canvas [data-block-id="${cssEscape(id)}"]`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function countLines(range) {
    const r = parseLineRange(range);
    if (!r) return 0;
    return r[1] - r[0] + 1;
  }

  // -------- Q&A --------
  function blockKey(storyline, col, block) {
    return `${storyline.id}/${col.id}/${block.id}`;
  }
  function renderQASection(block, storyline, col) {
    const key = blockKey(storyline, col, block);
    const list = state.followups[key] ?? [];
    const pending = state.pendingAsk && state.pendingAsk.blockKey === key;
    if (!state.liveMode && list.length === 0) return '';
    return `
      <div class="dock-section qa-section">
        <h4>Q&amp;A${state.liveMode ? '' : ' (snapshot — server offline)'}</h4>
        ${list.map(renderQAItem).join('')}
        ${pending ? `<div class="qa-pending"><div class="qa-spinner"></div>Asking… <button class="qa-cancel" id="qa-cancel">cancel</button></div>` : ''}
        ${state.liveMode && !pending ? renderQAInput() : ''}
      </div>
    `;
  }
  function renderQAItem(item) {
    return `
      <div class="qa-item">
        <div class="qa-q">Q: ${escapeHtml(item.question)}</div>
        <div class="qa-a">${renderRichMarkdown(item.answer || '')}</div>
        <div class="qa-meta">${escapeHtml(formatRelTime(item.ts))}</div>
      </div>
    `;
  }
  function renderQAInput() {
    return `
      <div class="qa-input-row">
        <textarea class="qa-input" id="qa-input" placeholder="Ask about this block… (Enter to send, Shift+Enter for newline)"></textarea>
        <button class="qa-submit" id="qa-submit">Ask</button>
      </div>
    `;
  }
  function bindQAControls(block, storyline, col) {
    const key = blockKey(storyline, col, block);
    const cancelBtn = document.getElementById('qa-cancel');
    if (cancelBtn) cancelBtn.onclick = () => cancelAsk();
    const submitBtn = document.getElementById('qa-submit');
    const input = document.getElementById('qa-input');
    if (submitBtn) submitBtn.onclick = () => submitQuestion(key, block, storyline, col);
    if (input) input.addEventListener('keydown', e => qaKeyDown(e, key, block, storyline, col));
  }
  function qaKeyDown(e, key, block, storyline, col) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      submitQuestion(key, block, storyline, col);
    }
  }
  async function submitQuestion(key, block, storyline, col) {
    const input = document.getElementById('qa-input');
    if (!input) return;
    const q = input.value.trim();
    if (!q) return;
    const abort = new AbortController();
    state.pendingAsk = { blockKey: key, q, abort, startedAt: Date.now() };
    renderDock();
    try {
      const body = {
        storyline_id: storyline.id,
        col_id: col.id,
        block_id: block.id,
        question: q,
      };
      const res = await fetch('/ask', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(body),
        signal: abort.signal,
      });
      if (!res.ok) throw new Error(`/ask returned HTTP ${res.status}`);
      const payload = await res.json();
      const item = {
        question: q,
        answer: payload.answer ?? '(no answer)',
        ts: payload.ts ?? new Date().toISOString(),
      };
      state.followups[key] = [...(state.followups[key] ?? []), item];
    } catch (err) {
      if (err.name !== 'AbortError') {
        const item = {
          question: q,
          answer: `**Error:** ${err.message ?? String(err)}`,
          ts: new Date().toISOString(),
        };
        state.followups[key] = [...(state.followups[key] ?? []), item];
      }
    } finally {
      state.pendingAsk = null;
      renderDock();
    }
  }
  function cancelAsk() {
    if (state.pendingAsk?.abort) state.pendingAsk.abort.abort();
    state.pendingAsk = null;
    renderDock();
  }
  async function preflight() {
    try {
      const res = await fetch('/__alive', { signal: AbortSignal.timeout(800) });
      if (!res.ok) return null;
      return await res.json();
    } catch (e) { return null; }
  }
  async function loadFollowups() {
    try {
      const res = await fetch('/followups', { signal: AbortSignal.timeout(2000) });
      if (!res.ok) return;
      const data = await res.json();
      state.followups = data.followups ?? {};
    } catch (e) {}
  }
  async function loadPromotions() {
    try {
      const res = await fetch('/promotions', { signal: AbortSignal.timeout(2000) });
      if (!res.ok) return;
      const data = await res.json();
      state.promotions = data.promotions ?? {};
    } catch (e) {}
  }

  async function promoteStoryline(storylineId) {
    if (state.pendingPromotions.has(storylineId)) return;
    if (!state.liveMode) {
      state.promotionErrors[storylineId] = 'Live server not available.';
      if (state.view === 'overview') renderOverview();
      return;
    }
    state.pendingPromotions.add(storylineId);
    delete state.promotionErrors[storylineId];
    if (state.view === 'overview') renderOverview();
    try {
      const res = await fetch('/promote', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ storyline_id: storylineId }),
        // No timeout — the CLI can legitimately take 1-3 minutes.
      });
      const payload = await res.json().catch(() => ({}));
      if (!res.ok) {
        const detail = payload?.error || `HTTP ${res.status}`;
        throw new Error(detail);
      }
      if (!payload.storyline) {
        throw new Error('server returned no storyline');
      }
      state.promotions[storylineId] = payload.storyline;
    } catch (err) {
      state.promotionErrors[storylineId] = err.message ?? String(err);
    } finally {
      state.pendingPromotions.delete(storylineId);
      if (state.view === 'overview') renderOverview();
    }
  }

  async function revertPromotion(storylineId) {
    // Optimistically drop the local promotion so the card flips back
    // immediately; if the server delete fails the user can re-promote.
    delete state.promotions[storylineId];
    delete state.promotionErrors[storylineId];
    if (state.view === 'overview') renderOverview();
    if (state.storylineId === storylineId && state.view === 'storyline') {
      goToOverview();
    }
    if (!state.liveMode) return;
    try {
      await fetch('/promote/revert', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ storyline_id: storylineId }),
      });
    } catch (e) {}
  }
  function renderLiveBadge() {
    if (state.liveMode) return `<span class="live-badge live">live</span>`;
    return `<span class="live-badge">static</span>`;
  }

  // -------- Markdown helpers --------
  function renderRichMarkdown(text) {
    if (!text) return '';
    const escaped = escapeHtml(text);
    const parts = escaped.split(/(```[\s\S]*?```)/g);
    return parts.map(part => {
      if (part.startsWith('```') && part.endsWith('```')) {
        const inner = part.slice(3, -3).replace(/^\w+\n/, '');
        return `<pre><code>${inner}</code></pre>`;
      }
      return part
        .split(/\n{2,}/)
        .map(para => {
          const lines = para.split('\n');
          const isList = lines.length > 0 && lines.every(l => /^\s*[-*]\s+/.test(l));
          if (isList) {
            return '<ul>' + lines.map(l => `<li>${renderInlineMarkdown(l.replace(/^\s*[-*]\s+/, ''))}</li>`).join('') + '</ul>';
          }
          return '<p>' + renderInlineMarkdown(para).replace(/\n/g, '<br>') + '</p>';
        })
        .join('');
    }).join('');
  }
  function renderInlineMarkdown(s) {
    return s
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\*([^*]+)\*/g, '<em>$1</em>');
  }
  function formatRelTime(ts) {
    if (!ts) return '';
    const t = new Date(ts).getTime();
    if (Number.isNaN(t)) return '';
    const dt = Date.now() - t;
    const s = Math.floor(dt / 1000);
    if (s < 5) return 'just now';
    if (s < 60) return `${s}s ago`;
    const m = Math.floor(s / 60);
    if (m < 60) return `${m}m ago`;
    const h = Math.floor(m / 60);
    if (h < 24) return `${h}h ago`;
    return new Date(ts).toLocaleString();
  }

  // -------- Nav --------
  function goToOverview() {
    state.view = 'overview';
    state.storylineId = null;
    state.expandedBlockIds = [];
    state.focusedBlockId = null;
    saveState();
    render();
  }
  function goToStoryline(id) {
    state.view = 'storyline';
    state.storylineId = id;
    state.expandedBlockIds = [];
    state.focusedBlockId = null;
    saveState();
    render();
  }
  function resetView() {
    state.expandedBlockIds = [];
    state.focusedBlockId = null;
    saveState();
    if (state.view === 'storyline') {
      renderStoryline();
      renderDock();
      requestAnimationFrame(() => renderEdges(getStoryline(state.storylineId)));
    } else {
      render();
    }
  }

  // -------- Keyboard --------
  function bindKeyboard() {
    document.addEventListener('keydown', e => {
      const tag = document.activeElement?.tagName;
      if (tag === 'TEXTAREA' || tag === 'INPUT') return;
      if (e.key === 'Escape') {
        if (state.focusedBlockId) closeDock();
        else if (state.expandedBlockIds.length) collapseAll();
        else if (state.view === 'storyline') goToOverview();
        return;
      }
      if (e.key === 'o') { goToOverview(); return; }
      if ((e.key === 'j' || e.key === 'k') && state.view === 'storyline') {
        const ids = collectBlockIds(getStoryline(state.storylineId));
        if (!ids.length) return;
        const idx = ids.indexOf(state.focusedBlockId);
        const next = e.key === 'j' ? (idx < 0 ? 0 : Math.min(ids.length - 1, idx + 1)) : Math.max(0, idx - 1);
        const id = ids[next];
        focusBlock(id);
        scrollBlockIntoView(id);
      }
    });
  }
  function collectBlockIds(storyline) {
    if (!storyline?.diagram) return [];
    const out = [];
    for (const c of storyline.diagram.cols ?? []) {
      for (const b of c.blocks ?? []) out.push(b.id);
    }
    return out;
  }

  // Keep the --topbar-h CSS var in sync with the actual topbar height so the
  // fixed dock anchors right below it on resize / view change.
  function syncTopbarHeight() {
    const top = document.getElementById('topbar');
    if (!top) return;
    const h = Math.round(top.getBoundingClientRect().height);
    document.documentElement.style.setProperty('--topbar-h', h + 'px');
  }

  function setupResize() {
    window.addEventListener('resize', () => {
      syncTopbarHeight();
      if (state.view === 'storyline') {
        requestAnimationFrame(() => renderEdges(getStoryline(state.storylineId)));
      }
    });
  }

  // -------- Escape helpers --------
  function escapeHtml(s) {
    return String(s ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }
  function escapeAttr(s) { return escapeHtml(s); }

  // -------- Top-level render --------
  function render() {
    renderTopbar();
    syncTopbarHeight();
    const main = document.getElementById('main');
    if (state.view === 'overview') {
      renderOverview();
      const dock = document.getElementById('dock');
      dock.classList.remove('open');
      main?.classList.remove('dock-open');
      dock.innerHTML = '';
    } else {
      renderStoryline();
      renderDock();
    }
  }

  // -------- Init --------
  async function init() {
    loadState();
    if (!state.view) state.view = 'overview';
    if (state.view === 'storyline' && !getStoryline(state.storylineId)) {
      state.view = 'overview';
      state.storylineId = null;
      state.expandedBlockIds = [];
      state.focusedBlockId = null;
    }
    render();
    bindKeyboard();
    setupResize();
    const info = await preflight();
    if (info) {
      state.liveMode = true;
      state.serverInfo = info;
      await Promise.all([loadFollowups(), loadPromotions()]);
      render();
    }
  }
  init();
</script>
</body>
</html>
